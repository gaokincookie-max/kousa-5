function bioNext(){if(!bioSession)return;if(bioSession.index>=bioSession.ids.length-1){bioFinish();return}bioSession.index++;bioAnswer=null;bioReveal=false;bioStore.active=bioSession;bioSave();bioQuiz()}
function bioFinish(){if(!bioSession){bioGo('bioHome');return}let s=bioSession;let record={time:Date.now(),duration:Math.round((Date.now()-s.started)/1000),results:s.results,total:s.results.length,correct:s.results.filter(x=>x.ok).length,mode:s.mode,kind:s.kind};bioStore.history.unshift(record);bioStore.history=bioStore.history.slice(0,150);bioStore.active=null;bioSave();bioSession=null;bioGo('bioResult')}
function bioQuiz(scroll=true){let q=bioCurrent();if(!q){bioGo('bioHome');return}let r=bioSession.results.find(x=>x.id===q.id),ok=r?.ok;let choices=q.opts.map((value,i)=>({value,i}));let seed=q.id.length*97+Number(q.id.slice(1))*31;for(let i=choices.length-1;i>0;i--){let j=(seed+i*13)%(i+1);[choices[i],choices[j]]=[choices[j],choices[i]]}let opts=choices.map((x,j)=>`<button class="choice ${bioReveal&&x.i===q.answer?'correct':''} ${bioReveal&&x.i===bioAnswer&&!ok?'wrong':''}" onclick="bioSelect(${x.i})" ${bioReveal?'disabled':''}><span class="letter">${'ABCD'[j]}</span><span>${h(x.value)}</span></button>`).join('');let why=bioReveal?`<div role="status" aria-live="polite" class="explain ${ok?'':'wrong'}"><h3>${ok?'✓ 正解！':bioAnswer===-1?'↷ スキップ':'✕ 不正解'}　<span style="font-size:14px">正答：${h(q.opts[q.answer])}</span></h3><p><b>考え方・根拠</b></p><p>${h(q.why)}</p><p><b>復習のヒント</b>：設問条件と、紛らわしい別の仕組みを区別してください。計算問題は何を分母とするかも確認しましょう。</p><div class="source"><strong>📖 生物基礎 教科書 p.${h(q.page)}</strong><br>${h(bioTopic(q))}の本文・図・表が参照先です。参照箇所は送付された教科書写真に基づきます。</div></div>`:'';let saved=bioStore.bookmarks.includes(q.id);A.innerHTML=`<header class="top"><div class="brand">✦ 考査週間⑤問題集</div><span class="tag">🧬 生物基礎</span></header>${back('bioHome')}<div class="row mobilewrap"><div><div class="eyebrow" style="color:#8cdeb7">BIOLOGY / ${bioSession.mode==='extreme'?'EXTREME':'NORMAL'}</div><h2 style="margin:3px 0">${bioSession.index+1} / ${bioSession.ids.length} 問</h2></div><div class="rowwrap"><span class="tag">${q.typ==='calculation'?'計算':q.typ==='reason'?'考察':'知識'}</span><span class="tag ${q.mode==='extreme'?'gold':''}">${q.mode==='extreme'?'🔥 変態':'通常'}</span></div></div><div class="bar"><div style="width:${Math.floor(bioSession.index/bioSession.ids.length*100)}%"></div></div><div class="space"></div><div class="card"><div class="row mobilewrap"><span class="tag">${h(bioTopic(q))}</span><button class="toggle bookmark" data-biobookmark onclick="bioMark()">${saved?'★ 保存済み':'☆ ブックマーク'}</button></div><div class="question">${h(q.q)}</div>${opts}${why}<div class="space"></div>${bioReveal?button(bioSession.index===bioSession.ids.length-1?'結果を見る':'次の問題へ →','bioNext()','primary full'):button('わからないのでスキップ','bioSkip()','full')}</div><div class="space"></div><div class="row mobilewrap"><span class="helper">選択肢を1回タップすると即採点します</span><button class="toggle" onclick="if(confirm('ここまでの結果を確定して終了しますか？'))bioFinish()">途中終了</button></div>`;if(scroll)window.scrollTo(0,0)}
function bioResult(){let record=bioStore.history[0];if(!record){bioGo('bioHome');return}let stats={};for(let r of record.results){let q=BIOQ.find(x=>x.id===r.id);if(!q)continue;stats[q.topic]??={n:0,c:0};stats[q.topic].n++;if(r.ok)stats[q.topic].c++}let bad=record.results.filter(x=>!x.ok);shell(`${back('bioHome')}<div class="eyebrow">BIOLOGY / RESULT</div><h1>🧬 演習結果</h1><div class="grid"><div class="stat"><div class="big">${Math.round(record.correct/Math.max(record.total,1)*100)}%</div><small>正答率</small></div><div class="stat"><div class="big">${record.correct} / ${record.total}</div><small>正解数</small></div><div class="stat"><div class="big">${Math.floor(record.duration/60)}分${record.duration%60}秒</div><small>学習時間</small></div></div><div class="sectionhead"><h2>単元別の達成度</h2></div><div class="card">${Object.entries(stats).map(([k,v])=>`<div class="selectline"><span>${h(BIO_TOPICS.find(t=>t[0]===k)?.[1]||k)}</span><b>${v.c}/${v.n}（${Math.round(v.c/v.n*100)}%）</b></div>`).join('')}</div><div class="sectionhead"><h2>今回の復習</h2></div><div class="card">${bad.length?bad.map(x=>{let q=BIOQ.find(y=>y.id===x.id);return `<div class="resultline"><span>✕</span><div><b>${h(q.q)}</b><div class="helper">正解：${h(q.opts[q.answer])} ／ 教科書 p.${h(q.page)}</div></div></div>`}).join(''):'全問正解です。'}</div><div class="space"></div>${bad.length?button('間違いだけ再挑戦','bioRetryWrong()','primary full'):''}<div class="space"></div>${button('生物のメニューに戻る','bioGo(\'bioHome\')','full')}`)}
function bioReview(){let ids=bioTab==='wrong'?bioStore.wrong:bioStore.bookmarks;let bank=ids.map(id=>BIOQ.find(x=>x.id===id)).filter(Boolean);shell(`${back('bioHome')}<div class="eyebrow">BIOLOGY / REVIEW</div><h1>★ 復習リスト</h1><div class="chipgroup"><button class="chip ${bioTab==='wrong'?'active':''}" onclick="bioTab='wrong';bioReview()">間違えた問題（${bioStore.wrong.length}）</button><button class="chip ${bioTab==='bookmarks'?'active':''}" onclick="bioTab='bookmarks';bioReview()">ブックマーク（${bioStore.bookmarks.length}）</button></div><div class="space"></div>${bank.length?`<div class="card">${bank.map(q=>`<details class="details-review"><summary>${h(q.q)}</summary><div class="helper">${h(bioTopic(q))} ／ 教科書 p.${h(q.page)}</div><p><b>正解：</b>${h(q.opts[q.answer])}</p><p>${h(q.why)}</p></details>`).join('')}</div><div class="space"></div>${button('選択中の問題を解く','bioRetryList()','primary full')}`:'<div class="card"><p class="muted">まだ問題がありません。</p></div>'}`)}
function bioStats(){let records=bioStore.history,done=records.reduce((s,x)=>s+x.total,0),correct=records.reduce((s,x)=>s+x.correct,0);shell(`${back('bioHome')}<div class="eyebrow">BIOLOGY / PERFORMANCE</div><h1>📊 成績・演習履歴</h1><div class="grid"><div class="stat"><div class="big">${records.length}</div><small>演習回数</small></div><div class="stat"><div class="big">${done}</div><small>解いた問題</small></div><div class="stat"><div class="big">${done?Math.round(correct/done*100):0}%</div><small>累計正答率</small></div></div><div class="sectionhead"><h2>最近の結果</h2></div>${records.length?records.slice(0,30).map(r=>`<div class="listcard"><div class="row"><b>${r.mode==='extreme'?'🔥 変態':'通常'}／${r.kind==='all'?'総合':r.kind==='knowledge'?'知識':r.kind==='calculation'?'計算':'考察'}</b><span>${r.correct}/${r.total}</span></div><div class="helper">${new Date(r.time).toLocaleString('ja-JP')}　${Math.floor(r.duration/60)}分${r.duration%60}秒</div></div>`).join(''):'<div class="card">まだ記録がありません。</div>'}<div class="space"></div><div class="notice">生物の履歴は化学・歴史と独立して、このブラウザ内に保存されます。</div><div class="space"></div>${button('生物の成績・復習記録を初期化','bioClear()','danger full')}`)}
function bioRetryWrong(){let rec=bioStore.history[0];if(rec)bioStart(rec.results.filter(x=>!x.ok).map(x=>x.id))}
function bioRetryList(){bioStart((bioTab==='wrong'?bioStore.wrong:bioStore.bookmarks).slice())}
function bioClear(){if(confirm('生物の履歴・誤答・ブックマークを初期化しますか？')){bioStore={history:[],wrong:[],bookmarks:[],active:null};bioSession=null;bioSave();bioStats()}}

function backupPanel(){return `<div class="card backup-area"><h2 style="margin:0 0 6px">💾 学習データのバックアップ</h2><p class="helper">学習履歴は利用中のブラウザだけに保存されます。公開URLへ移行したり端末を変えたりするときは、バックアップファイルで引き継げます。</p><div class="backup-actions"><button class="btn" onclick="exportBackup()">↓ データを書き出す</button><button class="btn ghost" onclick="document.getElementById('restoreBackup').click()">↑ バックアップを読み込む</button></div><input type="file" id="restoreBackup" accept=".json,application/json" style="display:none" onchange="importBackup(this.files[0]);this.value=''" aria-label="バックアップJSONファイルを選択"></div>`}
function exportBackup(){
 const data={format:'exam-week-5-backup',version:1,exportedAt:new Date().toISOString(),chemistry:store,history:histStore,biology:bioStore};
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='考査週間⑤学習データ-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importBackup(file){
 if(!file)return;
 try{
  if(file.size>5*1024*1024)throw Error('ファイルが大きすぎます（最大5MB）。');
  const data=JSON.parse(await file.text());
  if(data.format!=='exam-week-5-backup'||data.version!==1)throw Error('この問題集用のバックアップではありません。');
  const valid=x=>x&&typeof x==='object'&&!Array.isArray(x)&&Array.isArray(x.history)&&Array.isArray(x.wrong)&&Array.isArray(x.bookmarks)&&('active' in x);
  if(!valid(data.chemistry)||!valid(data.history)||!valid(data.biology))throw Error('データの形式が正しくありません。');
  if(!confirm('現在の3科目の履歴・ブックマーク・進行状況をバックアップの内容で上書きします。よろしいですか？'))return;
  store={...store,...data.chemistry};histStore={...histStore,...data.history};bioStore={...bioStore,...data.biology};
  session=store.active;histSession=histStore.active;bioSession=bioStore.active;
  persist();histSave();bioSave();alert('学習データを読み込みました。');navigate('home');
 }catch(e){alert('読み込めませんでした：'+e.message)}
}

render();
</script></body></html>
