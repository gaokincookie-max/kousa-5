<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a2c"><meta name="description" content="化学・生物基礎・歴史総合の454問でテスト対策。ワンタップ採点、詳しい解説、復習、学習履歴に対応する無料の問題集。"><meta name="color-scheme" content="dark"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>考査週間⑤問題集</title><style>
:root{--bg:#0b1323;--panel:#151f31;--raised:#1b2941;--line:#31425c;--txt:#edf3ff;--muted:#a8b5c9;--accent:#75b9ff;--green:#69d9b0;--red:#ff8294;--gold:#ffc96b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:15px;line-height:1.68}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#app{max-width:940px;margin:0 auto;min-height:100vh;padding:0 16px 70px}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0 16px;gap:12px}.brand{font-size:16px;font-weight:900;letter-spacing:.03em}.muted{color:var(--muted)}.sm{font-size:12px}.xs{font-size:11px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.13em}.btn{border:1px solid var(--line);background:var(--raised);color:var(--txt);border-radius:13px;padding:12px 16px;font-weight:750;transition:.12s}.btn:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}.primary{background:#3576ca;border-color:#4c91e6;color:white}.ghost{background:transparent}.danger{color:var(--red)}.full{width:100%}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.hero{background:linear-gradient(145deg,#1a355b 0%,#182138 70%);padding:30px 23px;border:1px solid #385578;border-radius:24px;margin-bottom:18px}.hero h1{margin:6px 0 9px;font-size:clamp(25px,5vw,42px);line-height:1.3}.hero p{margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.subject{min-height:200px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}.subject .emoji{font-size:34px}.subject h2{font-size:23px;margin:10px 0 0}.subject p{margin:0;color:var(--muted);font-size:12px}.tag{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:800;border:1px solid var(--line);color:var(--muted)}.tag.ok{border-color:#2d9679;color:var(--green)}.tag.gold{border-color:#b7853d;color:var(--gold)}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:24px 0 11px;gap:10px}.sectionhead h2{font-size:19px;margin:0}.back{background:transparent;border:0;color:var(--accent);padding:10px 0;font-weight:800}.steps{font-size:12px;color:var(--muted);letter-spacing:.03em}.tile{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:20px;color:var(--txt)}.tile strong{font-size:19px}.tile small{display:block;color:var(--muted);margin-top:5px}.tile:hover{border-color:var(--accent)}.selectline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.selectline:last-child{border:0}.chipgroup{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:9px 14px;color:var(--txt);font-size:13px}.chip.active{background:#2a5b91;color:#fff;border-color:#75b9ff}.checkitem{padding:9px 11px;background:var(--raised);border-radius:12px;display:flex;gap:9px;align-items:center;font-size:13px}.checkitem input{width:17px;height:17px;accent-color:#75b9ff}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.rowwrap{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.space{height:14px}.measure{background:var(--raised);padding:12px;border-radius:13px}.bar{height:9px;background:#26364e;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:var(--accent);border-radius:20px}.question{font-size:clamp(18px,3.2vw,24px);font-weight:850;line-height:1.7;white-space:pre-wrap;margin:18px 0}.choice{display:flex;gap:12px;text-align:left;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:13px;padding:13px 14px;color:var(--txt);width:100%;margin-bottom:9px}.choice.selected{background:#254d78;border-color:var(--accent)}.choice .letter{display:inline-flex;align-items:center;justify-content:center;width:27px;min-width:27px;height:27px;background:#26364e;border-radius:8px;color:var(--accent);font-weight:900}.choice.correct{border-color:var(--green);background:#163d39}.choice.wrong{border-color:var(--red);background:#4a2938}.numrow{display:flex;gap:12px;align-items:center}.numrow input{background:#0d1829;color:var(--txt);padding:15px;font-size:23px;font-weight:800;min-width:0;flex:1;border-radius:13px;border:1px solid var(--line);width:100%}.numrow span{min-width:60px;color:var(--muted)}.explain{background:#142e36;border:1px solid #356f70;border-radius:17px;padding:18px;margin:16px 0}.explain.wrong{background:#322131;border-color:#875069}.explain h3{margin:0 0 8px;font-size:18px}.explain p{margin:8px 0;white-space:pre-wrap}.source{margin-top:13px;border-top:1px solid #42636a;padding-top:11px;font-size:12px;color:#c7d6e6}.source strong{color:#a8e7ff}.helper{color:var(--muted);font-size:12px}.stat{background:var(--raised);border-radius:16px;padding:15px;text-align:center}.stat .big{font-size:27px;font-weight:900}.stat small{color:var(--muted)}.resultlist{max-height:380px;overflow:auto}.resultline{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}.divider{border:0;border-top:1px solid var(--line);margin:20px 0}.sr{position:absolute;width:1px;height:1px;overflow:hidden}.notice{border:1px solid #6f5c33;background:#332e20;padding:13px;border-radius:13px;color:#ffe2a8;font-size:13px}.footer{margin:32px 0;text-align:center;font-size:12px;color:#8292ab}.toggle{border:0;background:transparent;color:var(--accent);text-decoration:underline}.listcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--raised)}.bookmark{font-size:20px;color:var(--gold)}@media(max-width:650px){.grid{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.subject{min-height:137px}.card{padding:16px}.hero{padding:24px 20px}.top{padding:10px 0}.row.mobilewrap{flex-wrap:wrap}}

'use strict';
const QUESTIONS=[{"id":"k01","topic":"relative","mode":"normal","kind":"knowledge","q":"炭素12の原子1個の相対質量として定める値は？","opts":["12","1","6.0×10²³","24"],"answer":0,"why":"相対質量の基準は¹²C原子1個の質量を12とすること。炭素の同位体を混同しない。","page":"86","work":"40, 50（66）"},{"id":"k02","topic":"relative","mode":"normal","kind":"knowledge","q":"原子量について正しい説明は？","opts":["天然の同位体の相対質量を存在比で平均した値","原子1個の質量をgで表した値","陽子だけの質量","必ず整数になる値"],"answer":0,"why":"原子量は、同位体の相対質量×存在比の和。存在比を%で与えられたら100で割る。","page":"87","work":"40, 50（67・68）"},{"id":"k03","topic":"relative","mode":"normal","kind":"knowledge","q":"原子量の単位として適切なのは？","opts":["単位はない","g","g/mol","mol"],"answer":0,"why":"原子量は比として定義された無次元量。一方、モル質量にはg/molが付く。","page":"86–87","work":"40"},{"id":"k04","topic":"relative","mode":"normal","kind":"knowledge","q":"同位体とは？","opts":["陽子数が等しく中性子数が異なる原子","中性子数が等しく陽子数が異なる原子","原子量が同じ元素","電子数が異なる分子"],"answer":0,"why":"同じ元素は陽子数が同じ。同位体では中性子数が異なるので質量数が異なる。","page":"87","work":"50（67・68）"},{"id":"k05","topic":"formula","mode":"normal","kind":"knowledge","q":"分子量の求め方は？","opts":["分子を構成する原子量の総和","原子量の平均","分子の体積の和","原子の個数のみ"],"answer":0,"why":"化学式に含まれる各元素の原子量に、その原子数を掛けて足す。","page":"88","work":"40–41, 43"},{"id":"k06","topic":"formula","mode":"normal","kind":"knowledge","q":"NaClに対して分子量でなく式量を使う理由は？","opts":["NaClは分子でなくイオン結晶として存在するため","Naが金属だから重い","Clが気体だから","NaClには原子がないため"],"answer":0,"why":"NaClはNa⁺とCl⁻が規則的に並ぶイオン結晶で、独立したNaCl分子を作らない。組成式から式量を求める。","page":"88","work":"40–41, 43"},{"id":"k07","topic":"formula","mode":"normal","kind":"knowledge","q":"Ca(OH)₂中の酸素原子の数は（式単位1つあたり）？","opts":["2","1","3","4"],"answer":0,"why":"括弧の後ろの2はOH全体に掛かるため、OもHも2個ずつ含む。","page":"88–89","work":"43, 50（69）"},{"id":"k08","topic":"mole","mode":"normal","kind":"knowledge","q":"1 molに含まれる粒子の数は？","opts":["6.0×10²³個","22.4個","6.0×10²²個","1.0×10²³個"],"answer":0,"why":"アボガドロ定数はこの教科書では6.0×10²³ /mol。物質の種類に関係なく1 molはこの個数。","page":"90","work":"41, 43–44"},{"id":"k09","topic":"mole","mode":"normal","kind":"knowledge","q":"物質量の単位は？","opts":["mol","g","L","mol/L"],"answer":0,"why":"物質量（粒子をまとめて数える量）の単位がmol。gは質量、Lは体積、mol/Lはモル濃度。","page":"90","work":"41, 43"},{"id":"k10","topic":"mole","mode":"normal","kind":"knowledge","q":"H₂O 1 molに含まれる水素原子の物質量は？","opts":["2 mol","1 mol","3 mol","0.5 mol"],"answer":0,"why":"H₂O分子1個にはH原子が2個ある。水分子のmolに2を掛ける。","page":"91","work":"44（A）, 51（73）"},{"id":"k11","topic":"mole","mode":"normal","kind":"knowledge","q":"CaCl₂ 1 molに含まれる塩化物イオンは？","opts":["2 mol","1 mol","3 mol","0 mol"],"answer":0,"why":"式単位CaCl₂ 1個にCl⁻が2個。Ca²⁺は1 mol、Cl⁻は2 mol。","page":"91","work":"44（A）, 51（73）"},{"id":"k12","topic":"mass","mode":"normal","kind":"knowledge","q":"モル質量の単位は？","opts":["g/mol","g","mol","L/mol"],"answer":0,"why":"モル質量は1 molあたりの質量。原子量・式量と数値が同じでも単位はg/mol。","page":"92","work":"41–42, 45"},{"id":"k13","topic":"mass","mode":"normal","kind":"knowledge","q":"物質量を質量から求める式は？","opts":["質量÷モル質量","質量×モル質量","質量÷22.4","質量×6.0×10²³"],"answer":0,"why":"n[mol]=w[g]÷M[g/mol]。単位のgが消えてmolが残る。","page":"92–93","work":"41–42, 45"},{"id":"k14","topic":"gas","mode":"normal","kind":"knowledge","q":"標準状態の条件は？","opts":["0℃、1.013×10⁵ Pa","25℃、1.013×10⁵ Pa","0℃、0 Pa","100℃、1.013×10⁵ Pa"],"answer":0,"why":"この教科書の標準状態は0℃、1.013×10⁵ Pa（ほぼ1気圧）。気体の22.4 L/molはこの条件で使う。","page":"94–95","work":"41, 43, 45–48"},{"id":"k15","topic":"gas","mode":"normal","kind":"knowledge","q":"標準状態で気体1 molが占める体積は？","opts":["22.4 L","24.0 L","11.2 L","44.8 L"],"answer":0,"why":"気体の種類によらず標準状態のモル体積は22.4 L/mol。","page":"94","work":"41, 43–48"},{"id":"k16","topic":"gas","mode":"normal","kind":"knowledge","q":"アボガドロの法則は何を表す？","opts":["同温・同圧、同体積の気体には同数の分子がある","気体の質量は同体積なら等しい","異なる気体の密度は常に等しい","気体は必ず酸素を含む"],"answer":0,"why":"同温・同圧なら体積は分子数に比例する。質量や密度が等しいわけではない。","page":"94","work":"42, 53"},{"id":"k17","topic":"gas","mode":"normal","kind":"knowledge","q":"標準状態で気体の密度dとモル質量Mの関係は？","opts":["d=M/22.4","d=22.4M","d=M×6.0×10²³","d=M/1000"],"answer":0,"why":"1 molの質量がM g、体積が22.4 Lなので、密度はM÷22.4 g/L。","page":"94","work":"41, 52–53（75）"},{"id":"k18","topic":"gas","mode":"normal","kind":"knowledge","q":"同温・同圧の気体同士で、反応式の係数比と一致するものは？","opts":["体積比","質量比","密度比","モル質量比"],"answer":0,"why":"気体の体積は物質量に比例するので体積比は係数比に一致する。ただし気体でないものには適用しない。","page":"106–107","work":"42, 58–61"},{"id":"k19","topic":"gas","mode":"normal","kind":"knowledge","q":"混合気体の平均モル質量を求める正しい方法は？","opts":["各気体のモル質量×物質量割合を加える","モル質量を無条件に足す","最も多い気体のモル質量だけ使う","分子数を無視して単純平均する"],"answer":0,"why":"M平均=Σ(Mi×xi)。xiはモル分率で合計1。同温同圧なら体積割合もモル分率に等しい。","page":"95","work":"53（76）, 63（95）"},{"id":"k20","topic":"solution","mode":"normal","kind":"knowledge","q":"溶質とは？","opts":["溶媒に溶けている物質","溶かしている液体","溶液の体積","溶液の容器"],"answer":0,"why":"食塩水なら食塩が溶質、水が溶媒、全体が溶液。","page":"98","work":"41, 53–54"},{"id":"k21","topic":"solution","mode":"normal","kind":"knowledge","q":"質量パーセント濃度の分母は？","opts":["溶液の質量","溶媒だけの質量","溶質だけの質量","溶液の体積"],"answer":0,"why":"質量%=(溶質の質量/溶液の質量)×100。溶液=溶質+溶媒である。","page":"98","work":"41, 54（78・79）"},{"id":"k22","topic":"solution","mode":"normal","kind":"knowledge","q":"モル濃度の定義は？","opts":["溶液1 Lに含まれる溶質のmol","水1 Lに含まれる溶質のg","溶液100 g中の溶質のg","溶媒1 mol中の溶質のmol"],"answer":0,"why":"c[mol/L]=n[mol]/V[L]。体積は「溶媒」ではなく「できあがった溶液」の体積。","page":"98–99","work":"41, 49, 54, 63（96）"},{"id":"k23","topic":"solution","mode":"normal","kind":"knowledge","q":"溶液を水で薄めた際、変わらないものは？","opts":["溶質の物質量","溶液の体積","モル濃度","溶液の質量"],"answer":0,"why":"希釈では溶質を増減させないのでc₁V₁=c₂V₂が成り立つ。溶液体積は増え、濃度は下がる。","page":"99","work":"54（78）, 63（96）"},{"id":"k24","topic":"solution","mode":"normal","kind":"knowledge","q":"1.0 mol/Lの溶液を500 mL作るとき正しい操作は？","opts":["溶質を溶かし最後に溶液全体を500 mLにする","水500 mLに溶質を追加する","ビーカーの目盛りだけで合わせる","溶質を量らなくてよい"],"answer":0,"why":"体積は「溶液の最終体積」。メスフラスコの標線まで水を加える。最初の水量が500 mLではない。","page":"99","work":"41（調製）, 53（77）"},{"id":"k25","topic":"reaction","mode":"normal","kind":"knowledge","q":"化学反応式で変えてはいけないものは？","opts":["化学式中の右下の数字（添字）","化学式の前の係数","反応式の左右に付く係数","係数を整数倍した表現"],"answer":0,"why":"係数は変えてよいが、添字を変えると物質が別物になる。原子数が左右で等しくなるよう係数のみ調整。","page":"102","work":"41–42, 49, 57（82–84）"},{"id":"k26","topic":"reaction","mode":"normal","kind":"knowledge","q":"化学反応式の左右で必ず等しいものは？","opts":["元素ごとの原子数","分子の総数","気体の体積の総和","物質量の総和"],"answer":0,"why":"反応前後で元素ごとの原子数は保存される。分子総数や物質量合計は一般に変化し得る。","page":"102, 106–107","work":"42, 49, 57"},{"id":"k27","topic":"reaction","mode":"normal","kind":"knowledge","q":"イオン反応式で省くのは？","opts":["反応前後で変化しないイオン","沈殿となるイオン","生成する物質","電荷すべて"],"answer":0,"why":"傍観イオンを省略し、実際に反応する粒子を残す。左右で原子数だけでなく電荷の総和も一致させる。","page":"103","work":"41, 57（82）"},{"id":"k28","topic":"reaction","mode":"normal","kind":"knowledge","q":"Ag⁺とCl⁻からAgClが沈殿する反応式は？","opts":["Ag⁺ + Cl⁻ → AgCl","Ag⁺ + 2Cl⁻ → AgCl","Ag + Cl → AgCl⁻","Ag⁺ + Cl⁻ → AgCl⁺"],"answer":0,"why":"Ag⁺の電荷+1とCl⁻の電荷−1が打ち消されて中性のAgClとなる。","page":"103","work":"57, 64–65（99）"},{"id":"k29","topic":"reaction","mode":"normal","kind":"knowledge","q":"反応式 2H₂+O₂→2H₂O の係数が表すものは？","opts":["物質量の比2:1:2","質量比2:1:2","密度比2:1:2","温度比2:1:2"],"answer":0,"why":"係数の比=反応に関わる粒子数の比=物質量の比。水は通常、標準状態で液体なので気体体積比にそのまま置き換えない。","page":"106–107","work":"42, 58–59"},{"id":"k30","topic":"reaction","mode":"normal","kind":"knowledge","q":"質量保存の法則として正しい説明は？","opts":["反応前後で全物質の質量の総和は等しい","生成物のmolの合計は必ず等しい","気体の体積は常に保存される","化合物中の質量比は変わり続ける"],"answer":0,"why":"原子の種類と数が保存されるため全体の質量も保存。発生気体が外へ出る実験では容器内の見かけの質量は減り得る。","page":"107","work":"42, 62（93）, 65（101）"},{"id":"k31","topic":"reaction","mode":"normal","kind":"knowledge","q":"定比例の法則とは？","opts":["同じ化合物をつくる元素の質量比は一定","気体の体積比が常に整数","同じ体積の気体の質量が同じ","すべての化合物の原子量が等しい"],"answer":0,"why":"化合物が一定の組成を持つため、例えば水のH:O質量比は1:8で一定。","page":"107（質量比）, 89（参考・歴史）","work":"42, 62（93）, 65（101）"},{"id":"k32","topic":"reaction","mode":"normal","kind":"knowledge","q":"気体反応の法則で「簡単な整数比」になるものは？","opts":["同温・同圧で反応する気体と生成する気体の体積比","気体の質量比","気体の密度比","モル質量比"],"answer":0,"why":"係数比=同温・同圧の気体の体積比。気体ではない物質を体積比に含めない。","page":"107","work":"42, 62（93）"},{"id":"k33","topic":"limit","mode":"normal","kind":"knowledge","q":"反応物が2種類あり不足する方を判別するとき比較するのは？","opts":["それぞれのmol÷反応式の係数","それぞれのgのみ","それぞれの密度","それぞれの分子量のみ"],"answer":0,"why":"n/係数を比較し、最小の反応物が先に使い切られる。その値を反応進行量として各係数倍する。","page":"110–111","work":"58（85）, 60–61（88–91）, 64–65（98–99）"},{"id":"k34","topic":"limit","mode":"normal","kind":"knowledge","q":"過不足のある反応で生成物の量を決めるのは？","opts":["先に使い切られる反応物","より質量が大きい反応物","モル質量が大きい反応物","常に酸素"],"answer":0,"why":"過剰にある反応物を基準にすると生成物を過大評価する。制限反応物を基準に計算する。","page":"110–111","work":"60–61（88–91）"},{"id":"k35","topic":"limit","mode":"normal","kind":"knowledge","q":"反応物の残量を求める式は？","opts":["反応前の量−反応した量","反応前の量＋生成量","係数×密度","初期mol×22.4"],"answer":0,"why":"反応式で求めた実際に消費した物質量を、反応前の物質量から引く。","page":"110–111","work":"60–61（90）"},{"id":"k36","topic":"solution","mode":"normal","kind":"knowledge","q":"質量％20%の溶液100 gに含まれる溶質は？","opts":["20 g","5 g","80 g","120 g"],"answer":0,"why":"質量%=溶質÷溶液×100。溶質=100×20/100=20 g。","page":"98","work":"54（78）"},{"id":"k37","topic":"formula","mode":"normal","kind":"knowledge","q":"H₂SO₄の式中に含まれる酸素原子の個数は？","opts":["4","1","2","8"],"answer":0,"why":"添字の4はO原子の数。Hは2個、Sは1個。","page":"88","work":"43, 50（69）"},{"id":"k38","topic":"mole","mode":"normal","kind":"knowledge","q":"水分子1 mol中の全原子の物質量は？","opts":["3 mol","1 mol","2 mol","6 mol"],"answer":0,"why":"H₂Oの原子数はH2個＋O1個=3個なので、分子1 molあたり原子は計3 mol。","page":"91","work":"44, 51（73）"},{"id":"k39","topic":"gas","mode":"normal","kind":"knowledge","q":"気体の体積22.4 L/molを使えない場合は？","opts":["温度・圧力が標準状態以外で与えられる場合","標準状態の酸素","標準状態の水素","標準状態のヘリウム"],"answer":0,"why":"22.4 L/molは標準状態の条件付き。常温の気体に無条件で代入しない。","page":"94–95","work":"41, 47–48"},{"id":"k40","topic":"solution","mode":"normal","kind":"knowledge","q":"100 mLは何Lか？","opts":["0.100 L","0.010 L","1.00 L","1000 L"],"answer":0,"why":"1 L=1000 mLなので100÷1000=0.100 L。濃度計算の頻出ミス。","page":"98–99","work":"49, 54（78）"},{"id":"k41","topic":"reaction","mode":"normal","kind":"knowledge","q":"2NaHCO₃ → Na₂CO₃+CO₂+H₂O でNaHCO₃とCO₂のmol比は？","opts":["2:1","1:1","1:2","2:3"],"answer":0,"why":"係数をそのまま読むと2:1。NaHCO₃が0.2 molならCO₂は0.1 mol。","page":"106–109","work":"58–59"},{"id":"k42","topic":"limit","mode":"normal","kind":"knowledge","q":"反応物のmol÷係数が等しいときは？","opts":["両方とも同時に使い切られる","必ず両方余る","生成物は出ない","常に係数が1である"],"answer":0,"why":"ちょうど反応式の量論比で混合されているため、反応が完結すれば両方使い切られる。","page":"110–111","work":"60–61"},{"id":"k43","topic":"solution","mode":"normal","kind":"knowledge","q":"1.0 mol/LのNaCl水溶液200 mLにあるNaClは？","opts":["0.20 mol","5.0 mol","1.0 mol","200 mol"],"answer":0,"why":"n=cV=1.0×0.200=0.20 mol。mL→Lの変換を先に行う。","page":"99","work":"49, 54（78）"},{"id":"k44","topic":"reaction","mode":"normal","kind":"knowledge","q":"イオン反応式 Ag⁺+Cl⁻→AgCl の左右の合計電荷は？","opts":["どちらも0","左+2 右0","左−1 右0","左右とも+1"],"answer":0,"why":"左は(+1)+(−1)=0、右のAgClは電荷0。イオン反応式では電荷も保存する。","page":"103","work":"41, 57"},{"id":"k45","topic":"mass","mode":"normal","kind":"knowledge","q":"CO₂のモル質量として正しいものは？","opts":["44 g/mol","28 g/mol","32 g/mol","12 g/mol"],"answer":0,"why":"炭素12、酸素16×2で44。分子量44は単位なし、モル質量44 g/mol。","page":"88, 92","work":"43, 45"},{"id":"xk01","topic":"relative","mode":"extreme","kind":"knowledge","q":"同位体A(質量63・存在比x)、B(質量65・存在比1−x)の原子量が63.6。Aの存在比は？","opts":["70%","30%","60%","40%"],"answer":0,"why":"63x+65(1−x)=63.6 →65−2x=63.6 →x=0.70。百分率の表記に戻して70%。","page":"87","work":"50（67–68）"},{"id":"xk02","topic":"mole","mode":"extreme","kind":"knowledge","q":"水1 molとCO₂ 1 mol、含まれる「原子の総数」はどうなる？","opts":["どちらも3 mol分で等しい","水が多い","CO₂が多い","分子量が大きいCO₂が多い"],"answer":0,"why":"どちらも三原子分子なので1分子に3原子。物質量が同じなら全原子の物質量も等しい。質量差に惑わされない。","page":"90–91","work":"44, 51（73–74）"},{"id":"xk03","topic":"gas","mode":"extreme","kind":"knowledge","q":"同温同圧で気体AとBの密度比が3:2なら、モル質量の比は？","opts":["3:2","2:3","9:4","1:1"],"answer":0,"why":"M=d×モル体積。同温・同圧ならモル体積は共通なので密度比はモル質量比に等しい。","page":"94–95","work":"53（75）"},{"id":"xk04","topic":"solution","mode":"extreme","kind":"knowledge","q":"溶液を2倍の体積に希釈するとモル濃度は？","opts":["半分になる","2倍になる","変わらない","0になる"],"answer":0,"why":"希釈でn一定なのでc=n/V。体積だけ2倍ならcは1/2。","page":"99","work":"54（78）, 63（96）"},{"id":"xk05","topic":"reaction","mode":"extreme","kind":"knowledge","q":"反応式 2CO+O₂→2CO₂ で密閉系の「総物質量」は？","opts":["減る","増える","必ず一定","条件不足で不明"],"answer":0,"why":"完全反応で反応物合計3 mol相当が生成物2 mol相当に変わる。質量は保存されてもmolの総和は保存されない。","page":"106–107","work":"42, 58–59"},{"id":"xk06","topic":"limit","mode":"extreme","kind":"knowledge","q":"A+2B→3C。A=0.40 mol、B=0.60 molのときCの最大生成量は？","opts":["0.90 mol","1.20 mol","0.60 mol","1.00 mol"],"answer":0,"why":"A側0.40/1=0.40、B側0.60/2=0.30なのでB不足。反応進行量0.30×C係数3=0.90 mol。","page":"110–111","work":"60–61（88–91）"},{"id":"xk07","topic":"formula","mode":"extreme","kind":"knowledge","q":"Cu(NO₃)₂ 1式単位あたり、酸素原子は何個か？","opts":["6","3","2","8"],"answer":0,"why":"NO₃が2組ある。Oは3×2=6個。括弧の外の数字に注意。","page":"88–89","work":"43, 50（69）"},{"id":"xk08","topic":"reaction","mode":"extreme","kind":"knowledge","q":"化学反応式で化学種を消去してイオン反応式にするとき必要な条件は？","opts":["両辺で同じイオンが同じ量存在すること","すべてのイオンを消すこと","電荷を考慮しないこと","固体まで電離させること"],"answer":0,"why":"電離する強電解質の水溶液をイオンで表し、左右で変化しない同種イオンを消去する。沈殿は固体として残す。","page":"103","work":"41, 57"},{"id":"xk09","topic":"gas","mode":"extreme","kind":"knowledge","q":"N₂:O₂=4:1（体積比）の混合気体の平均モル質量は？","opts":["28.8 g/mol","30.0 g/mol","29.6 g/mol","28.0 g/mol"],"answer":0,"why":"同温同圧なら体積比=mol比。28×4/5+32×1/5=28.8。比を単純に4倍・1倍しない。","page":"95","work":"53（76）"},{"id":"xk10","topic":"solution","mode":"extreme","kind":"knowledge","q":"溶液1 Lの質量が1200 g、質量%濃度が20%、溶質のモル質量が60 g/mol。モル濃度は？","opts":["4.0 mol/L","2.0 mol/L","20 mol/L","0.2 mol/L"],"answer":0,"why":"溶質は1200×0.20=240 g、240/60=4 mol。溶液1 Lだから4 mol/L。","page":"100","work":"54（79）, 63（96）"},{"id":"xk11","topic":"limit","mode":"extreme","kind":"knowledge","q":"A+2B→C。A 0.20 mol・B 0.20 molを反応させた場合、余るAは？","opts":["0.10 mol","0.20 mol","0.00 mol","0.30 mol"],"answer":0,"why":"B 0.20 molを消費するにはA 0.10 mol必要。Aは0.20−0.10=0.10 mol余る。","page":"110–111","work":"60–61"},{"id":"xk12","topic":"mole","mode":"extreme","kind":"knowledge","q":"CaCl₂ 0.50 molの式単位がすべて電離したとき、イオン全体の物質量は？","opts":["1.5 mol","1.0 mol","0.50 mol","2.5 mol"],"answer":0,"why":"Ca²⁺が0.50 mol、Cl⁻が1.00 molで合計1.50 mol。","page":"91","work":"44, 51（73）"},{"id":"xk13","topic":"reaction","mode":"extreme","kind":"knowledge","q":"化学反応式の係数比と一致しない可能性があるのは？","opts":["反応物と生成物の質量比","各物質のmol比","粒子の個数比","同温同圧の気体の体積比"],"answer":0,"why":"質量は係数×モル質量に比例する。係数比そのものにはならない。","page":"106–107","work":"42, 58"},{"id":"xk14","topic":"mass","mode":"extreme","kind":"knowledge","q":"物質A 0.20 molが10 g、B 0.10 molが10 g。モル質量が大きいのは？","opts":["B（Aの2倍）","A（Bの2倍）","同じ","判定できない"],"answer":0,"why":"M=w/n。Aは10/0.20=50、Bは10/0.10=100 g/mol。","page":"92","work":"45–46"},{"id":"xk15","topic":"gas","mode":"extreme","kind":"knowledge","q":"密閉容器中のN₂+3H₂→2NH₃で、反応前後の気体の体積の合計は同温同圧で？","opts":["理論上半分","2倍","変わらない","4倍"],"answer":0,"why":"係数合計は反応前4、反応後2。全部反応して気体NH₃と見なせる条件なら、同温同圧の合計体積は1/2。","page":"106–107","work":"42, 59–61"},{"id":"xk16","topic":"solution","mode":"extreme","kind":"knowledge","q":"密度1.2 g/mLで質量%20%の溶液を2倍に希釈。希釈後の質量%を無条件に10%と言える？","opts":["言えない。体積2倍でも加えた水の質量が元の溶液質量とは限らない","常に10%","必ず20%","水を加えると0%"],"answer":0,"why":"希釈で溶質量は一定だが、体積2倍と質量2倍は同義でない。モル濃度は半分でも質量%は密度情報なしでは確定できない。","page":"98–100","work":"54（78–79）"},{"id":"cm0","topic":"mass","mode":"normal","kind":"calculation","q":"水 H₂O が 0.1 molある。質量は何gか。","answer":1.8,"unit":"g","why":"① 水 H₂O のモル質量は 18 g/mol。② w=M×n=18×0.1=1.8 g。molを質量へ戻すときは掛け算。","page":"92–93","work":"45–47（B,D）","tol":0.012},{"id":"cn0","topic":"mass","mode":"normal","kind":"calculation","q":"水 H₂O が 1.8 gある。物質量は何molか。","answer":0.1,"unit":"mol","why":"① 水 H₂O のモル質量 M=18 g/mol。② n=w/M=1.8÷18=0.1 mol。gからmolは割り算。","page":"92–93","work":"45–47（B,D）","tol":0.012},{"id":"cm1","topic":"mass","mode":"normal","kind":"calculation","q":"二酸化炭素 CO₂ が 0.2 molある。質量は何gか。","answer":8.8,"unit":"g","why":"① 二酸化炭素 CO₂ のモル質量は 44 g/mol。② w=M×n=44×0.2=8.8 g。molを質量へ戻すときは掛け算。","page":"92–93","work":"45–47（B,D）","tol":0.012},{"id":"cn1","topic":"mass","mode":"normal","kind":"calculation","q":"二酸化炭素 CO₂ が 8.8 gある。物質量は何molか。","answer":0.2,"unit":"mol","why":"① 二酸化炭素 CO₂ のモル質量 M=44 g/mol。② n=w/M=8.8÷44=0.2 mol。gからmolは割り算。","page":"92–93","work":"45–47（B,D）","tol":0.012},{"id":"cm2","topic":"mass","mode":"normal","kind":"calculation","q":"酸素 O₂ が 0.25 molある。質量は何gか。 100で割る。","page":"87","work":"50（67・68）","tol":0.012},{"id":"ci7","topic":"relative","mode":"normal","kind":"calculation","q":"同位体X（相対質量14・存在比60%）とY（相対質量15・残りの存在比）からなる元素の原子量を求めよ。","answer":14.4,"unit":"","why":"原子量=相対質量の加重平均。14×0.6＋15×0.4=14.4。存在比は%を100で割る。","page":"87","work":"50（67・68）","tol":0.012},{"id":"xe01","topic":"solution","mode":"extreme","kind":"calculation","q":"密度1.84 g/mL、質量%95%の硫酸（M=98）を使い、3.0 mol/Lの硫酸500 mLを作る。濃硫酸は何mL必要か。","answer":84.1,"unit":"mL","why":"濃硫酸1 mLの質量=1.84 g、H₂SO₄質量=1.84×0.95=1.748 g、物質量=1.748/98 mol。必要量は3.0×0.500=1.50 molだからV=1.50÷(1.748/98)=84.10 mL。水を加えて全量500 mLにする。","page":"98–100","work":"63（96）","tol":0.014},{"id":"xe02","topic":"limit","mode":"extreme","kind":"calculation","q":"Mg 4.8 gと酸素O₂ 2.4 gを密閉容器で完全に反応可能なだけ反応させた。残るMgは何gか。反応式 2Mg+O₂→2MgO。","answer":1.2,"unit":"g","why":"Mg=4.8/24=0.20 mol、O₂=2.4/32=0.075 mol。係数で割ると0.20/2=0.10、0.075/1=0.075で酸素不足。反応Mg=0.075×2=0.15 mol。残るMg=(0.20−0.15)×24=1.2 g。","page":"110–111","work":"58（例題16）, 60–61","tol":0.014},{"id":"xe03","topic":"limit","mode":"extreme","kind":"calculation","q":"Mg 2.4 gと酸素O₂ 1.6 gを反応させた。生成したMgOは何gか。2Mg+O₂→2MgO。","answer":4.0,"unit":"g","why":"Mg=2.4/24=0.10 mol、O₂=1.6/32=0.050 mol。比0.10:0.050=2:1でどちらも使い切る。MgOは0.10 mol×40=4.0 g。","page":"110–111","work":"58, 60–61","tol":0.014},{"id":"xe04","topic":"limit","mode":"extreme","kind":"calculation","q":"N₂ 14 g、H₂ 2.0 gを反応させる。N₂+3H₂→2NH₃。生成NH₃の質量は何gか。","answer":11.333333333333332,"unit":"g","why":"N₂=14/28=0.50 mol。H₂=2.0/2=1.0 mol。係数で割るとN₂側0.50、H₂側1/3なのでH₂不足。NH₃=(1/3)×2=2/3 mol、質量=(2/3)×17=11.33 g。","page":"110–111","work":"59–61","tol":0.014},{"id":"xe06","topic":"gas","mode":"extreme","kind":"calculation","q":"CO₂とO₂の混合気体が標準状態で11.2 Lあり、質量は19.0 gだった。CO₂の物質量は何molか。","answer":0.25,"unit":"mol","why":"全体n=11.2/22.4=0.50 mol。CO₂をx molならO₂は0.50−x mol。44x+32(0.50−x)=19.0 →12x=3.0 →x=0.25 mol。","page":"94–97","work":"53（75・76）, 63（95）","tol":0.014},{"id":"xe08","topic":"reaction","mode":"extreme","kind":"calculation","q":"プロパンC₃H₈を完全燃焼し、標準状態で44.8 LのCO₂を得た。必要なO₂の体積は標準状態で何Lか。C₃H₈+5O₂→3CO₂+4H₂O。","answer":74.66666666666667,"unit":"L","why":"CO₂は44.8/22.4=2.0 mol。係数O₂:CO₂=5:3よりO₂=2.0×5/3 mol。標準状態でV=22.4×(10/3)=74.67 L。","page":"106–109","work":"58–59（86・87）","tol":0.014},{"id":"xe09","topic":"limit","mode":"extreme","kind":"calculation","q":"CaCO₃ 10 gに、濃度1.0 mol/Lの塩酸150 mLを加える。CaCO₃+2HCl→CaCl₂+CO₂+H₂O。標準状態で発生するCO₂の体積は何Lか。","answer":1.68,"unit":"L","why":"CaCO₃は10/100=0.10 mol、HClは1.0×0.150=0.15 mol。CaCO₃側0.10/1=0.10、HCl側0.15/2=0.075なので塩酸不足。CO₂=0.075 mol、体積=0.075×22.4=1.68 L。","page":"110–111","work":"60–61（88–91）","tol":0.014},{"id":"xe10","topic":"reaction","mode":"extreme","kind":"calculation","q":"硫酸銅などは用いない。NaHCO₃ 16.8 gを加熱分解し、発生したCO₂だけを標準状態で集める。CO₂は何Lか。2NaHCO₃→Na₂CO₃+CO₂+H₂O。","answer":2.24,"unit":"L","why":"NaHCO₃のモル質量=84。16.8/84=0.20 mol。CO₂は係数比2:1より0.10 mol。体積0.10×22.4=2.24 L。","page":"106–109","work":"58–59","tol":0.014},{"id":"xe11","topic":"mass","mode":"extreme","kind":"calculation","q":"CaCl₂が0.20 mol存在し、完全に電離する。溶液中のCl⁻だけの粒子数は何個か。","answer":2.4e+23,"unit":"個","why":"CaCl₂ 1式単位からCl⁻は2個。Cl⁻は0.20×2=0.40 mol。個数=0.40×6.0×10²³=2.4×10²³個。","page":"90–93","work":"44, 51（73）","tol":0.014},{"id":"xe12","topic":"relative","mode":"extreme","kind":"calculation","q":"相対質量35と37の同位体からなる元素の平均原子量が35.5である。質量37の同位体の存在比は何%か。","answer":25.0,"unit":"%","why":"質量37の割合をxとする。35(1−x)+37x=35.5 →2x=0.5 →x=0.25=25%。","page":"87","work":"50（67）","tol":0.014},{"id":"xe13","topic":"solution","mode":"extreme","kind":"calculation","q":"質量％40%、密度1.3 g/mLの硫酸水溶液（M=98）のモル濃度は何mol/Lか。","answer":5.3061224489795915,"unit":"mol/L","why":"1 Lの溶液は1300 g、その40%はH₂SO₄ 520 g。物質量520/98=5.306 mol。1 Lなので同数値mol/L。","page":"98–100","work":"54（79）, 63（96）","tol":0.014},{"id":"xe14","topic":"gas","mode":"extreme","kind":"calculation","q":"窒素と酸素が体積比4:1の混合気体が標準状態で44.8 Lある。この混合気体の質量は何gか。","answer":57.6,"unit":"g","why":"合計n=44.8/22.4=2 mol。窒素1.6 mol、酸素0.4 mol。質量=1.6×28+0.4×32=44.8+12.8=57.6 g。","page":"95","work":"53（76）, 63（95）","tol":0.014},{"id":"xe15","topic":"limit","mode":"extreme","kind":"calculation","q":"Zn 6.54 gを1.0 mol/Lの塩酸100 mLと反応させた。Zn+2HCl→ZnCl₂+H₂。反応後のZnの残量は何gか。","answer":3.27,"unit":"g","why":"Zn=6.54/65.4=0.100 mol、HCl=1.0×0.100=0.100 mol。Zn 0.050 molが反応するので残り0.050 mol×65.4=3.27 g。","page":"110–111","work":"58（85）, 60–61","tol":0.014},{"id":"xe16","topic":"solution","mode":"extreme","kind":"calculation","q":"0.50 mol/LのNaOH 250 mLを作るのに必要なNaOHは何gか。M=40。","answer":5.0,"unit":"g","why":"必要n=cV=0.50×0.250=0.125 mol。質量=0.125×40=5.0 g。最後に溶液全体を250 mLに調整する。","page":"98–99","work":"49, 53–54","tol":0.014},{"id":"xe17","topic":"reaction","mode":"extreme","kind":"calculation","q":"2Al+6HCl→2AlCl₃+3H₂。Al 5.4 gを塩酸過剰で反応させると、標準状態で水素は何L発生するか。","answer":6.72,"unit":"L","why":"Al=5.4/27=0.20 mol。係数2:3よりH₂=0.20×3/2=0.30 mol。体積=0.30×22.4=6.72 L。","page":"106–109","work":"58–59","tol":0.014},{"id":"xe18","topic":"solution","mode":"extreme","kind":"calculation","q":"ある水溶液100 gに溶質20 gが含まれる。さらに溶質5 gと水25 gを加えた。新しい質量パーセント濃度は何%か。","answer":19.230769230769234,"unit":"%","why":"溶質は20+5=25 g、溶液の質量は100+5+25=130 g。質量%=25/130×100=約19.23%。追加の水だけを分母にしない。","page":"98","work":"54（78・79）","tol":0.014},{"id":"xe19","topic":"gas","mode":"extreme","kind":"calculation","q":"標準状態で気体の密度が1.25 g/L。気体のモル質量は何g/molか。","answer":28.0,"unit":"g/mol","why":"M=d×22.4=1.25×22.4=28 g/mol。モル体積を逆に割らない。","page":"94–95","work":"52–53（75）","tol":0.014},{"id":"xe20","topic":"limit","mode":"extreme","kind":"calculation","q":"CaCO₃ 25 gの純度が80%で、不純物は塩酸と反応しない。塩酸過剰で反応させたとき標準状態で発生するCO₂は何Lか。","answer":4.48,"unit":"L","why":"実際のCaCO₃は25×0.80=20 gで0.20 mol。CaCO₃+2HCl→CaCl₂+CO₂+H₂OよりCO₂も0.20 mol。V=0.20×22.4=4.48 L。","page":"106–111","work":"59（86）, 64（97）","tol":0.014},{"id":"xe21","topic":"solution","mode":"extreme","kind":"calculation","q":"1.0 mol/LのNaOH水溶液100 mLに、水を加え最終250 mLにした後、そのうち50 mLを取った。取り出した中のNaOHは何molか。","answer":0.02,"unit":"mol","why":"希釈後濃度は1.0×100/250=0.40 mol/L。取り出した50 mL中の量は0.40×0.050=0.020 mol。溶液全体の量と一部分の量を区別。","page":"98–100","work":"54（78）, 63（96）","tol":0.014},{"id":"xe22","topic":"reaction","mode":"extreme","kind":"calculation","q":"N₂+3H₂→2NH₃。N₂ 11.2 Lを水素過剰で完全反応させたとき、生じるNH₃は同温同圧で何Lか。","answer":22.4,"unit":"L","why":"同温同圧なら気体の体積比は係数比1:2。11.2×2=22.4 L。標準状態への変換は不要。","page":"106–109","work":"58–59","tol":0.014},{"id":"xe23","topic":"limit","mode":"extreme","kind":"calculation","q":"Mg 0.30 molとHCl 0.50 molを反応させた。Mg+2HCl→MgCl₂+H₂。Mgの残量は何molか。","answer":0.05,"unit":"mol","why":"塩酸0.50 molで反応できるMgは0.50/2=0.25 mol。Mgは0.30−0.25=0.05 mol余る。","page":"110–111","work":"60–61","tol":0.014},{"id":"xe24","topic":"relative","mode":"extreme","kind":"calculation","q":"天然の元素にA(相対質量10)が80%、B(相対質量11)が20%ある。この元素の原子量は？","answer":10.2,"unit":"","why":"10×0.80+11×0.20=10.2。存在比を小数で扱い加重平均する。","page":"87","work":"50（67・68）","tol":0.014}];
const HISTORYQ=[{"id":"h001","topic":"war","mode":"normal","q":"1938年に制定され、政府が労働力や物資を広く動員する根拠となった法律は？","opts":["治安維持法","農地調整法","国家総動員法","労働組合法"],"answer":2,"why":"国家総動員法は1938年に制定され、政府が議会の個別承認なしに人的・物的資源を統制する仕組みを強めた。政治組織の大政翼賛会（1940年）と区別する。","page":"133"},{"id":"h002","topic":"war","mode":"normal","q":"1940年に成立した、政治・国民を戦争協力へ組織する中心的な組織は？","opts":["国際連合","大政翼賛会","警察予備隊","産業報国会"],"answer":1,"why":"大政翼賛会は1940年結成。国家総動員法が法制度なら、大政翼賛会は政治的に国民を組織する体制に当たる。","page":"133"},{"id":"h003","topic":"war","mode":"normal","q":"第二次世界大戦が「総力戦」と呼ばれる理由として最も適切なのは？","opts":["兵士だけでなく労働力・産業・国民生活まで戦争に動員したため","軍隊だけで戦争が完結したため","世界各国が同時に中立を守ったため","海外での戦闘がなくなったため"],"answer":0,"why":"総力戦では軍の戦闘以外にも工場生産、物資配給、勤労動員など国民生活全体が戦争に組み込まれる。教科書の戦時経済統制と国民動員を関連づける。","page":"132-135"},{"id":"h004","topic":"war","mode":"normal","q":"戦争末期、学生を軍需工場などで働かせたことを何という？","opts":["農地改革","財閥解体","特需景気","学徒動員"],"answer":3,"why":"学徒動員は学校の生徒・学生を労働力として動員すること。戦争が長期化し労働力不足が深まったことが背景にある。","page":"134,236"},{"id":"h005","topic":"war","mode":"normal","q":"戦時中の女性の労働力動員で重要な組織は？","opts":["大政翼賛会","国連総会","女子挺身隊","日本社会党"],"answer":2,"why":"女子挺身隊は戦時下の女性の勤労動員に関係した。女性たちの軍需工場などでの労働と、戦争の総力戦化を結びつけて理解する。","page":"134"},{"id":"h006","topic":"war","mode":"normal","q":"戦時下の日本の朝鮮・台湾で進められた、日本への同化を強める政策の総称は？","opts":["逆コース","皇民化政策","マーシャル＝プラン","農地改革"],"answer":1,"why":"皇民化政策は日本語使用の強制など、植民地の人々を日本の『皇国臣民』に同化させようとする政策。内地の勤労動員と混同しない。","page":"134"},{"id":"h007","topic":"war","mode":"normal","q":"1945年3月10日の大規模な空襲で大きな被害を受けた都市は？","opts":["東京","広島","長崎","大阪"],"answer":0,"why":"東京大空襲は1945年3月10日。広島の原爆投下は8月6日、長崎は8月9日であり、攻撃の種類と日時を区別する。","page":"135,238"},{"id":"h008","topic":"war","mode":"normal","q":"広島に原子爆弾が投下された日は？","opts":["1945年8月9日","1945年8月15日","1945年9月2日","1945年8月6日"],"answer":3,"why":"広島は8月6日、長崎は8月9日。8月15日は玉音放送によって終戦が国民に告げられた日。","page":"239"},{"id":"h009","topic":"war","mode":"normal","q":"長崎に原子爆弾が投下された日は？","opts":["1945年8月6日","1945年7月26日","1945年8月9日","1945年8月15日"],"answer":2,"why":"長崎への原爆投下は8月9日。同じ日にソ連による対日参戦も始まった。広島は8月6日。","page":"239"},{"id":"h010","topic":"war","mode":"normal","q":"1945年8月15日に日本国民へ終戦を伝えた放送を何という？","opts":["ポツダム会談","玉音放送","サンフランシスコ会議","ブレトンウッズ会議"],"answer":1,"why":"1945年8月15日の玉音放送で、昭和天皇の声によって戦争終結が国民に伝えられた。降伏文書への署名は9月2日。","page":"239"},{"id":"h011","topic":"war","mode":"normal","q":"日本が受諾した、降伏条件を示す1945年の宣言は？","opts":["ポツダム宣言","世界人権宣言","大西洋憲章","日ソ共同宣言"],"answer":0,"why":"1945年7月のポツダム宣言は日本に降伏を要求した。受諾によって日本は降伏を決定した。1956年の日ソ共同宣言とは別物。","page":"239"},{"id":"h012","topic":"war","mode":"normal","q":"第二次世界大戦中、仕事や物資の供給を政府が強く制限した経済の仕組みを何という？","opts":["自由放任経済","固定為替相場制","ブレトンウッズ体制","統制経済"],"answer":3,"why":"統制経済では政府が生産、流通、価格、物資配分を統制した。これは戦争遂行のための制度で、戦後の国際金融制度とは区別する。","page":"133"},{"id":"h013","topic":"un","mode":"normal","q":"国際連合が正式に発足した年は？","opts":["1919年","1944年","1945年","1951年"],"answer":2,"why":"国際連合は1945年10月に発足。第一次世界大戦後の国際連盟（1920年発足）と区別する。","page":"136-137"},{"id":"h014","topic":"un","mode":"normal","q":"国際連合の主な設立目的は？","opts":["各国の植民地を一律に拡大すること","国際の平和と安全を維持すること","すべての国の通貨をドルへ統一すること","軍事同盟NATOを統括すること"],"answer":1,"why":"国際連合は第二次世界大戦の反省を背景に、平和と安全の維持、国際協力を目的として成立した。経済協力も扱うがNATOを統括する機関ではない。","page":"136-137"},{"id":"h015","topic":"un","mode":"normal","q":"国際連合で平和と安全の維持に主要な責任を持つ機関は？","opts":["安全保障理事会","経済社会理事会","国際司法裁判所","総会"],"answer":0,"why":"安全保障理事会は平和と安全への主要な責任を担う。総会は全加盟国が参加して討議する場であり、権限を区別する。","page":"137"},{"id":"h016","topic":"un","mode":"normal","q":"国際連合で原則としてすべての加盟国が参加する機関は？","opts":["安全保障理事会","国際司法裁判所","常任理事国会議","総会"],"answer":3,"why":"総会には全加盟国が参加する。安全保障理事会は一部の加盟国から構成され、常任理事国は特別な権限を持つ。","page":"137"},{"id":"h017","topic":"un","mode":"normal","q":"国連安保理の常任理事国に認められる特別な権限は？","opts":["単独の憲法改正権","国連脱退国の全財産没収権","拒否権","全加盟国の議会解散権"],"answer":2,"why":"重要な実質事項に関する決議は常任理事国の反対によって成立しない。これを拒否権という。国連の決定が大国対立で停滞する原因ともなる。","page":"137"},{"id":"h018","topic":"un","mode":"normal","q":"1945年に設立された国際連合の本部所在地は？","opts":["ジュネーブ","ニューヨーク","サンフランシスコ","パリ"],"answer":1,"why":"国連本部はニューヨーク。1945年の国連憲章署名はサンフランシスコ会議で行われたため、会議開催地と本部所在地を混同しない。","page":"136-137"},{"id":"h019","topic":"un","mode":"normal","q":"戦後の国際通貨制度の基礎を築いた1944年の会議は？","opts":["ブレトンウッズ会議","サンフランシスコ講和会議","ヤルタ会談","ベルリン会議"],"answer":0,"why":"1944年のブレトンウッズ会議からIMF・IBRDを中心とした戦後国際金融秩序の枠組みが形成された。1951年の講和会議とは区別する。","page":"138"},{"id":"h020","topic":"un","mode":"normal","q":"IMFの正式な日本語名は？","opts":["国際復興開発銀行","世界貿易機関","国際連合児童基金","国際通貨基金"],"answer":3,"why":"IMFは国際通貨基金で、為替や国際収支の安定を支援する機関。IBRDは国際復興開発銀行。略称と役割のセットで覚える。","page":"138"},{"id":"h021","topic":"un","mode":"normal","q":"IBRDの主な役割は？","opts":["国際平和維持の武力行使","軍縮条約の批准","復興・開発のための資金供給","関税撤廃の法的強制"],"answer":2,"why":"IBRD（国際復興開発銀行）は戦後復興・開発への融資を担う。IMFは国際通貨、GATTは貿易ルールの分野を主に扱う。","page":"138"},{"id":"h022","topic":"un","mode":"normal","q":"GATTが目指したことは？","opts":["各国軍隊の統合","貿易障壁の軽減と自由貿易の拡大","土地を小作農に売り渡すこと","ドルを禁止して金貨へ戻すこと"],"answer":1,"why":"GATTは関税及び貿易に関する一般協定。関税などの貿易障壁を減らし、国際貿易を自由化するための枠組み。","page":"138"},{"id":"h023","topic":"un","mode":"normal","q":"戦後の固定為替相場制の中心となった通貨は？","opts":["アメリカ・ドル","ソ連ルーブル","日本円","イギリスポンド"],"answer":0,"why":"ブレトンウッズ体制ではドルを中心に、金とドルの交換を基礎とする固定為替相場制が成立した。アメリカの経済力の強さが背景。","page":"138"},{"id":"h024","topic":"un","mode":"normal","q":"1944年のブレトンウッズ会議から形成された国際経済体制の名称は？","opts":["55年体制","大政翼賛会体制","ワルシャワ条約体制","ブレトンウッズ体制"],"answer":3,"why":"ブレトンウッズ体制は戦後の国際金融秩序を支える枠組み。55年体制は日本の政党政治の構図のため分野も時代も異なる。","page":"138"},{"id":"h025","topic":"occupation","mode":"normal","q":"戦後日本の占領を主導した連合国軍最高司令官総司令部の略称は？","opts":["IMF","GATT","GHQ","NATO"],"answer":2,"why":"GHQは連合国軍最高司令官総司令部。日本の非軍事化・民主化政策を主導した。国際経済機関や軍事同盟ではない。","page":"140-141,252-253"},{"id":"h026","topic":"occupation","mode":"normal","q":"連合国軍最高司令官として占領改革を主導した人物は？","opts":["吉田茂","ダグラス・マッカーサー","毛沢東","トルーマン"],"answer":1,"why":"マッカーサーはGHQ最高司令官。吉田茂は日本の首相、毛沢東は中華人民共和国の成立を宣言した指導者。","page":"141,253"},{"id":"h027","topic":"occupation","mode":"normal","q":"占領初期のGHQが目指した2つの基本方針は？","opts":["非軍事化と民主化","再軍備と軍国主義化","植民地拡大と保護貿易","軍政化と議会廃止"],"answer":0,"why":"非軍事化は日本が再び軍事的脅威にならないこと、民主化は政治参加と自由を広げること。戦後改革の共通の方向性。","page":"141,253"},{"id":"h028","topic":"occupation","mode":"normal","q":"日本本土の占領で、GHQが日本政府を通して政策を実施した形態は？","opts":["直接軍政のみ","委任統治","自治領統治","間接統治"],"answer":3,"why":"日本本土では日本政府や行政機構を通じてGHQの政策が実施されたため間接統治と呼ばれる。沖縄などの統治とは事情が異なる。","page":"141,252-253"},{"id":"h029","topic":"occupation","mode":"normal","q":"財閥解体のねらいとして最も適切なものは？","opts":["小作農から農地を取り上げること","民主的選挙を中止すること","少数の財閥への経済力集中を弱めること","すべての工場を軍需工場にすること"],"answer":2,"why":"財閥解体は経済民主化の一環。農地改革は地主・小作関係、選挙制度改革は政治参加を変えるもの。","page":"142,254"},{"id":"h030","topic":"occupation","mode":"normal","q":"農地改革で増加した農家の形態は？","opts":["小作農","自作農","大地主","農奴"],"answer":1,"why":"農地改革では地主が貸していた農地を小作農に売り渡す仕組みが進められ、自作農が大きく増加した。","page":"142,254"},{"id":"h031","topic":"occupation","mode":"normal","q":"戦後の政治改革によって新たに認められたものは？","opts":["女性参政権","天皇による議会の一方的解散権の拡大","地主の政治的特権","軍人だけの普通選挙"],"answer":0,"why":"戦後、女性に選挙権・被選挙権が認められ、1946年の総選挙で女性が初めて国政選挙に参加した。","page":"142,254-255"},{"id":"h032","topic":"occupation","mode":"normal","q":"日本国憲法が公布された日は？","opts":["1947年5月3日","1945年8月15日","1952年4月28日","1946年11月3日"],"answer":3,"why":"1946年11月3日が公布、1947年5月3日が施行。公布は法令を公に示すこと、施行は効力が発生すること。","page":"142-143,255"},{"id":"h033","topic":"occupation","mode":"normal","q":"日本国憲法が施行された日は？","opts":["1946年11月3日","1951年9月8日","1947年5月3日","1960年1月19日"],"answer":2,"why":"公布は1946年11月3日、施行は1947年5月3日。5月3日が憲法記念日であることも関連づける。","page":"143,255"},{"id":"h034","topic":"occupation","mode":"normal","q":"日本国憲法の三大原則に含まれないものは？","opts":["国民主権","天皇主権","基本的人権の尊重","平和主義"],"answer":1,"why":"日本国憲法の三大原則は国民主権、基本的人権の尊重、平和主義。天皇主権は大日本帝国憲法に関係する。","page":"143,255"},{"id":"h035","topic":"occupation","mode":"normal","q":"日本国憲法における天皇の地位は？","opts":["日本国と日本国民統合の象徴","統治権を総攬する主権者","国連の最高司令官","立法権を独占する大統領"],"answer":0,"why":"日本国憲法1条は天皇を日本国と日本国民統合の象徴と定め、その地位は主権の存する日本国民の総意に基づく。","page":"142-143,255"},{"id":"h036","topic":"occupation","mode":"normal","q":"日本国憲法第9条が定める重要な内容は？","opts":["国民の納税義務の廃止","地方議会の廃止","選挙権の年齢引き上げ","戦争の放棄"],"answer":3,"why":"第9条では戦争放棄などが定められる。三大原則の平和主義と対応する。","page":"142-143,255"},{"id":"h037","topic":"occupation","mode":"normal","q":"占領期に行われた労働者の団結権などを保障する法律は？","opts":["国家総動員法","治安維持法","労働組合法","日米安全保障条約"],"answer":2,"why":"労働組合法は戦後の労働改革を代表する法律。労働者が団結し、労働条件を改善するための仕組みに関係する。","page":"142,254"},{"id":"h038","topic":"cold","mode":"normal","q":"第二次世界大戦後、米ソの対立を中心として生じた国際的な対立状況を何という？","opts":["総力戦","冷戦","特需景気","農地改革"],"answer":1,"why":"冷戦はアメリカを中心とする西側とソ連中心の東側が政治・経済・軍事面で対立する状態を指す。直接の全面戦争を避けながら対抗した。","page":"146-147,256"},{"id":"h039","topic":"cold","mode":"normal","q":"1947年、共産主義の拡大を阻止する方針としてアメリカが示した政策は？","opts":["トルーマン＝ドクトリン","ポツダム宣言","日ソ共同宣言","大政翼賛会"],"answer":0,"why":"トルーマン＝ドクトリンは1947年に提示された共産主義勢力への封じ込め政策。マーシャル＝プランの経済支援策と区別する。","page":"146"},{"id":"h040","topic":"cold","mode":"normal","q":"戦後の西ヨーロッパ経済復興を支援した米国の構想は？","opts":["農地改革","国家総動員法","コメコン","マーシャル＝プラン"],"answer":3,"why":"マーシャル＝プランは1947年に提唱されたヨーロッパ復興計画。経済面で西側を支え、共産主義の拡大を防ぐ意図もあった。","page":"146"},{"id":"h041","topic":"cold","mode":"normal","q":"1949年に成立した西側の軍事同盟は？","opts":["コメコン","IMF","NATO","国際連合"],"answer":2,"why":"NATOは北大西洋条約機構で、1949年成立の西側軍事同盟。コメコンは東側の経済協力機構。","page":"146"},{"id":"h042","topic":"cold","mode":"normal","q":"1949年に成立した東側陣営の経済協力機構は？","opts":["NATO","コメコン","GATT","国際連盟"],"answer":1,"why":"コメコンは経済相互援助会議でソ連・東欧の経済協力を進めた。NATOは西側の軍事同盟。","page":"146"},{"id":"h043","topic":"cold","mode":"normal","q":"1948年、ソ連が西ベルリンへの陸路交通を遮断した出来事は？","opts":["ベルリン封鎖","ベルリンの壁崩壊","キューバ危機","ワルシャワ条約機構結成"],"answer":0,"why":"ベルリン封鎖は1948〜49年。西側は空輸で西ベルリンを支援し、東西対立が鮮明になった。ベルリンの壁崩壊は1989年。","page":"146"},{"id":"h044","topic":"cold","mode":"normal","q":"1949年、中国大陸で中華人民共和国の成立を宣言した人物は？","opts":["蒋介石","李承晩","マッカーサー","毛沢東"],"answer":3,"why":"毛沢東は1949年に中華人民共和国の成立を宣言。蒋介石の国民党政権は台湾へ移った。","page":"147"},{"id":"h045","topic":"cold","mode":"normal","q":"1949年、中国国民党の政権が移った地域は？","opts":["朝鮮半島北部","沖縄","台湾","ベルリン"],"answer":2,"why":"国共内戦で敗れた国民党政権は台湾へ移った。中国大陸には毛沢東の率いる中華人民共和国が成立。","page":"147"},{"id":"h046","topic":"cold","mode":"normal","q":"1948年、朝鮮半島の南側に成立した国は？","opts":["朝鮮民主主義人民共和国","大韓民国","中華人民共和国","日本国"],"answer":1,"why":"1948年、南側には大韓民国、北側には朝鮮民主主義人民共和国が成立。北緯38度線付近が分断の象徴となった。","page":"147,257"},{"id":"h047","topic":"cold","mode":"normal","q":"1948年、朝鮮半島の北側に成立した国は？","opts":["朝鮮民主主義人民共和国","大韓民国","中華民国","ソ連邦"],"answer":0,"why":"1948年、朝鮮半島北部に朝鮮民主主義人民共和国が成立。南部の大韓民国と対立が深まっていった。","page":"147,257"},{"id":"h048","topic":"cold","mode":"normal","q":"朝鮮戦争が勃発したのは何年？","opts":["1945年","1948年","1953年","1950年"],"answer":3,"why":"朝鮮戦争は1950年に始まり、1953年に休戦協定が結ばれた。開戦・休戦・南北の政府成立を区別する。","page":"147,257"},{"id":"h049","topic":"cold","mode":"normal","q":"朝鮮戦争で休戦協定が結ばれたのは何年？","opts":["1950年","1949年","1953年","1960年"],"answer":2,"why":"1953年に休戦協定が成立したが、平和条約で正式に戦争が終結したわけではない。","page":"147,257"},{"id":"h050","topic":"cold","mode":"normal","q":"朝鮮戦争の軍需物資発注などにより日本で生じた景気は？","opts":["バブル景気","特需景気","昭和恐慌","世界恐慌"],"answer":1,"why":"朝鮮戦争に伴う米軍の大量発注が日本の生産・雇用を刺激した。これを特需景気といい、戦後復興を後押しした。","page":"149,259"},{"id":"h051","topic":"cold","mode":"normal","q":"1950年に日本で創設された治安維持組織は？","opts":["警察予備隊","自衛隊","大政翼賛会","国連軍"],"answer":0,"why":"警察予備隊は1950年創設。朝鮮戦争で在日米軍の多くが出動した背景があり、1954年の自衛隊発足に連なる。","page":"149,259"},{"id":"h052","topic":"cold","mode":"normal","q":"1954年に発足した組織は？","opts":["警察予備隊","大政翼賛会","国際連合","自衛隊"],"answer":3,"why":"自衛隊は1954年に発足。警察予備隊は1950年、保安隊は1952年であり、段階的な変化を理解する。","page":"149,259"},{"id":"h053","topic":"independence","mode":"normal","q":"冷戦の進行によって占領初期の民主化方針が見直される変化を何という？","opts":["財閥解体","農地改革","逆コース","大政翼賛会"],"answer":2,"why":"逆コースは冷戦の激化を背景に占領政策が反共・経済復興を重視する方向へ転換したこと。初期改革とは方向性が異なる。","page":"148-149"},{"id":"h054","topic":"independence","mode":"normal","q":"サンフランシスコ平和条約の調印年は？","opts":["1945年","1951年","1952年","1960年"],"answer":1,"why":"条約調印は1951年9月8日、発効は1952年4月28日。調印と独立回復の時点を分けて覚える。","page":"150-151"},{"id":"h055","topic":"independence","mode":"normal","q":"サンフランシスコ平和条約が発効し、日本が主権を回復したのは？","opts":["1952年4月28日","1951年9月8日","1947年5月3日","1955年11月15日"],"answer":0,"why":"平和条約は1951年調印、1952年4月28日に発効して日本は主権を回復した。沖縄などは引き続き米国の施政権下にあった。","page":"150,258"},{"id":"h056","topic":"independence","mode":"normal","q":"講和と同時に調印された1951年の安全保障条約は？","opts":["新日米安全保障条約","ワルシャワ条約","日ソ中立条約","旧日米安全保障条約"],"answer":3,"why":"1951年には旧日米安全保障条約が調印された。1960年の改定による新条約と区別する。","page":"150-151"},{"id":"h057","topic":"independence","mode":"normal","q":"1951年に日本の講和と安保条約調印を進めた首相は？","opts":["岸信介","池田勇人","吉田茂","東条英機"],"answer":2,"why":"吉田茂内閣のもとでサンフランシスコ平和条約と旧日米安保条約が調印された。1960年安保改定を進めたのは岸信介。","page":"150,258"},{"id":"h058","topic":"independence","mode":"normal","q":"サンフランシスコ平和条約に調印しなかった大国は？","opts":["アメリカ","ソ連","イギリス","フランス"],"answer":1,"why":"ソ連は講和会議に出席したが条約には調印しなかった。中国を代表する政府は会議に招かれなかった。冷戦下の講和の特徴。","page":"150"},{"id":"h059","topic":"independence","mode":"normal","q":"1951年の講和後も米国の施政権下に残った地域は？","opts":["沖縄","北海道","本州","四国"],"answer":0,"why":"日本は1952年に主権を回復したが沖縄などは米国の施政権下に残った。完全な領域上の回復には時間がかかった。","page":"150-151"},{"id":"h060","topic":"independence","mode":"normal","q":"1955年に保守勢力の合同によって結成された政党は？","opts":["日本共産党","日本社会党","大政翼賛会","自由民主党"],"answer":3,"why":"1955年に保守合同により自由民主党が結成された。同年、日本社会党も左右両派が統一し、55年体制が形成された。","page":"259"},{"id":"h061","topic":"independence","mode":"normal","q":"1955年に成立した日本の政党政治の枠組みは？","opts":["ブレトンウッズ体制","新体制運動","55年体制","大政翼賛会"],"answer":2,"why":"保守合同による自由民主党と、統一した日本社会党の対抗を軸とする政治体制を55年体制という。長期にわたって自民党優位が続いた。","page":"259"},{"id":"h062","topic":"independence","mode":"normal","q":"1960年に日米安全保障条約の改定を進めた首相は？","opts":["吉田茂","岸信介","東条英機","幣原喜重郎"],"answer":1,"why":"1960年の新日米安全保障条約は岸信介内閣のもとで成立。1951年の旧条約調印は吉田茂内閣。","page":"259"},{"id":"h063","topic":"independence","mode":"normal","q":"1960年の日米安保改定に反対する大規模な運動は？","opts":["安保闘争","学徒動員","農地改革","自由民権運動"],"answer":0,"why":"1960年の安保改定をめぐり大規模な反対運動が起きた。日米同盟や戦争への巻き込まれへの懸念などが背景にある。","page":"259"},{"id":"h064","topic":"independence","mode":"normal","q":"1956年、日本とソ連の国交回復に道を開いた文書は？","opts":["ポツダム宣言","サンフランシスコ平和条約","日米修好通商条約","日ソ共同宣言"],"answer":3,"why":"日ソ共同宣言（1956年）によって国交が回復し、同じ年に日本は国連に加盟した。平和条約とは異なる。","page":"148-151（関連）"},{"id":"h065","topic":"olympic","mode":"normal","q":"日本が初めて近代オリンピックに参加した大会は？","opts":["1896年アテネ大会","1948年ロンドン大会","1912年ストックホルム大会","1964年東京大会"],"answer":2,"why":"日本が初参加したのは1912年のストックホルム大会。近代オリンピック自体の第1回大会は1896年アテネ。","page":"242-243"},{"id":"h066","topic":"olympic","mode":"normal","q":"近代オリンピックの第1回大会が開催された都市は？","opts":["東京","アテネ","パリ","ロンドン"],"answer":1,"why":"1896年にアテネで第1回近代オリンピックが開催された。日本の初参加はそれより後の1912年。","page":"242"},{"id":"h067","topic":"olympic","mode":"normal","q":"戦争の影響で開催が実現しなかった1940年の大会開催予定地は？","opts":["東京","ソウル","メキシコシティ","ミュンヘン"],"answer":0,"why":"1940年の東京オリンピックは戦争の影響で開催されなかった。1964年の東京大会との違いを意識する。","page":"243"},{"id":"h068","topic":"olympic","mode":"normal","q":"戦後の復興と国際社会への復帰を象徴した東京オリンピックの開催年は？","opts":["1940年","1952年","1972年","1964年"],"answer":3,"why":"1964年に東京オリンピックが開催され、同年東京パラリンピックも開かれた。開催されなかった1940年大会と区別する。","page":"243"},{"id":"h069","topic":"chronology","mode":"normal","q":"次の出来事で最も早いものは？","opts":["大政翼賛会の成立","国際連合の発足","国家総動員法の制定","日本国憲法の公布"],"answer":2,"why":"国家総動員法は1938年、大政翼賛会は1940年、国連は1945年、日本国憲法公布は1946年。年号を一列に並べて判断する。","page":"133,136,142"},{"id":"h070","topic":"chronology","mode":"normal","q":"次の出来事で最も遅いものは？","opts":["国際連合の成立","日本国憲法の施行","ポツダム宣言受諾","日本国憲法の公布"],"answer":1,"why":"憲法施行は1947年5月3日。国連成立と降伏は1945年、憲法公布は1946年。","page":"136,142-143,239"},{"id":"h071","topic":"chronology","mode":"normal","q":"次のうち、1949年の出来事は？","opts":["NATOの結成","国際連合の発足","国家総動員法の制定","日米安保条約の調印"],"answer":0,"why":"NATOは1949年。国連は1945年、国家総動員法は1938年、旧日米安保条約は1951年。","page":"146,136,133,150"},{"id":"h072","topic":"chronology","mode":"normal","q":"次のうち、1950年の出来事は？","opts":["朝鮮戦争の休戦","サンフランシスコ平和条約発効","日本国憲法公布","朝鮮戦争の勃発"],"answer":3,"why":"朝鮮戦争は1950年開始、1953年休戦。講和発効は1952年、憲法公布は1946年。","page":"147,150,142"},{"id":"h073","topic":"chronology","mode":"normal","q":"次のうち、1951年の出来事は？","opts":["日本の主権回復","55年体制成立","サンフランシスコ平和条約調印","新日米安保条約調印"],"answer":2,"why":"条約の調印は1951年、発効と独立回復は1952年。55年体制は1955年、安保改定は1960年。","page":"150-151,259"},{"id":"h074","topic":"chronology","mode":"normal","q":"次の組み合わせで正しいものは？","opts":["1947年―国家総動員法制定","1946年―日本国憲法公布","1949年―国際連合発足","1955年―サンフランシスコ平和条約調印"],"answer":1,"why":"日本国憲法公布は1946年。国家総動員法1938年、国連1945年、平和条約調印1951年。","page":"133,136,142,150"},{"id":"h075","topic":"chronology","mode":"normal","q":"次の出来事を古い順に並べた正しい組み合わせは？","opts":["国連発足→憲法公布→NATO結成→朝鮮戦争勃発","NATO結成→国連発足→憲法公布→朝鮮戦争勃発","憲法公布→国連発足→朝鮮戦争勃発→NATO結成","国連発足→朝鮮戦争勃発→憲法公布→NATO結成"],"answer":0,"why":"国連は1945年、憲法公布は1946年、NATOは1949年、朝鮮戦争は1950年。西暦を確認した上で順序を決める。","page":"136,142,146-147"},{"id":"h076","topic":"source","mode":"normal","q":"『国際の平和及び安全を維持する』という目的と最も深く関係する組織は？","opts":["大政翼賛会","警察予備隊","産業報国会","国際連合"],"answer":3,"why":"『国際の平和及び安全』は国際連合憲章の中心的な目的。戦後の国際協調体制を示す語句である。","page":"136-137"},{"id":"h077","topic":"source","mode":"normal","q":"『国政は国民の厳粛な信託による』という理念に結びつく原則は？","opts":["天皇主権","国家総動員","国民主権","軍事的抑止"],"answer":2,"why":"主権が国民にあり、政治権力が国民の信託に基づくという日本国憲法の理念を表す。大日本帝国憲法の天皇主権と比較する。","page":"142-143,255"},{"id":"h078","topic":"source","mode":"normal","q":"『天皇は、日本国の象徴であり日本国民統合の象徴』とする規定から読み取れるのは？","opts":["天皇が統治権を独占する","天皇は主権者ではなく象徴と位置づけられる","国会より天皇が立法権を持つ","国民は選挙権を失う"],"answer":1,"why":"日本国憲法1条の趣旨。主権は国民にあり、天皇は象徴と定められる。戦前の憲法における天皇の地位との違いが重要。","page":"142-143,255"},{"id":"h079","topic":"source","mode":"normal","q":"『再び戦争の惨禍が起こることのないように』という日本国憲法前文の趣旨と最も深く結びつく原則は？","opts":["平和主義","天皇主権","植民地拡大","統制経済"],"answer":0,"why":"戦争の惨禍への反省が、戦争の放棄などを定めた第9条とつながる。前文と第9条を関連づける。","page":"143,255"},{"id":"h080","topic":"source","mode":"normal","q":"戦後の日本で『女性参政権』を実現した改革の分類として適切なのは？","opts":["軍備の拡大","国際通貨の固定相場化","植民地支配の強化","政治の民主化"],"answer":3,"why":"女性参政権は政治参加を広げる民主化改革。1946年の総選挙に女性が初めて参加した点も重要。","page":"142,254-255"},{"id":"h081","topic":"source","mode":"normal","q":"『金・ドル本位制と固定為替相場』を説明する資料が示す戦後体制は？","opts":["55年体制","ワルシャワ条約体制","ブレトンウッズ体制","大政翼賛会体制"],"answer":2,"why":"金とドルの交換関係を軸に固定相場制を支えたのがブレトンウッズ体制。国際通貨基金（IMF）の役割とも関連する。","page":"138"},{"id":"h082","topic":"source","mode":"normal","q":"『自作農が増え、小作農が大幅に減る』という統計から読み取れる政策は？","opts":["財閥解体","農地改革","警察予備隊創設","安保改定"],"answer":1,"why":"農地改革によって地主から小作農への農地の売渡しが進み、自作農が増えた。統計は政策の結果を示している。","page":"142,254"},{"id":"h083","topic":"source","mode":"normal","q":"『在日米軍の朝鮮半島への出動と日本での警察予備隊創設』から読み取れる直接の背景は？","opts":["朝鮮戦争の勃発","東京オリンピック開催","日ソ共同宣言","第一次世界大戦終結"],"answer":0,"why":"朝鮮戦争が1950年に勃発し、在日米軍の多くが朝鮮半島へ移った。これと同じ年に警察予備隊が創設された。","page":"149,259"},{"id":"h084","topic":"source","mode":"normal","q":"『日本で急増する軍需物資・役務への発注』という統計が示す経済変化は？","opts":["世界恐慌","昭和恐慌","金輸出再禁止","特需景気"],"answer":3,"why":"朝鮮戦争期の米軍の発注が、日本国内の生産や雇用を増やした。特需景気は戦後復興を後押しした。","page":"149,259"},{"id":"h085","topic":"source","mode":"normal","q":"『日本の独立回復』と『米軍駐留の継続』の両方を説明する組み合わせは？","opts":["大政翼賛会と国家総動員法","IMFとGATT","平和条約と日米安全保障条約","農地改革と財閥解体"],"answer":2,"why":"1951年に講和条約と旧日米安保条約が調印され、1952年の独立回復後も米軍駐留が続いた。独立と安全保障の連動を理解する。","page":"150-151"},{"id":"h086","topic":"war","mode":"extreme","q":"1938年の国家総動員法と1940年の大政翼賛会の関係として最も適切なのは？","opts":["どちらも戦後民主化のための機関だった","法的な動員権限の強化と、政治・国民組織の一元化がそれぞれ戦争協力体制を支えた","前者が国際金融を、後者が軍事同盟を担当した","両者はともに占領期のGHQが設立した"],"answer":1,"why":"国家総動員法は人的・物的資源を国家が統制する法律、大政翼賛会は政治・国民の戦争協力体制を組織する政治組織。目的は共通するが仕組みは違う。","page":"133"},{"id":"h087","topic":"war","mode":"extreme","q":"『戦争の激化により学校から工場に学生が移され、植民地出身者も労働力に組み込まれた』という現象の解釈は？","opts":["戦争継続のため軍以外の社会全体を動員する総力戦が進んだ","軍需生産が不要になり民間経済へ転換した","戦争によって労働力不足が解消した","植民地支配が終了したことを示す"],"answer":0,"why":"学徒動員や植民地からの動員は国内の兵士不足・工場の労働力不足と結びつく。戦争が軍隊だけでは遂行できなかったことを示す具体例。","page":"134,236-237"},{"id":"h088","topic":"war","mode":"extreme","q":"1945年8月に起きた複数の出来事の順序として正しいのは？","opts":["長崎への原爆投下→広島への原爆投下→玉音放送","玉音放送→広島への原爆投下→長崎への原爆投下","広島への原爆投下→玉音放送→長崎への原爆投下","広島への原爆投下→長崎への原爆投下→玉音放送"],"answer":3,"why":"広島は8月6日、長崎は8月9日、玉音放送は8月15日。単純な終戦日と原爆投下日を混同しやすい。","page":"239"},{"id":"h089","topic":"un","mode":"extreme","q":"大国が脱退する問題に苦しんだ国際連盟への反省を踏まえた国際連合の特徴として最も適切なのは？","opts":["軍事的問題を完全に禁止して経済問題だけを扱った","常任理事国のすべての権限を廃止した","主要国を常任理事国として安全保障の決定に組み込む一方、拒否権という制約も設けた","主要国をすべて国際連合から排除した"],"answer":2,"why":"国連は大国の参加と協力を前提とし、安保理常任理事国に拒否権を与えた。これは国連の実効性を高める工夫でもあり、米ソ対立で機能不全になり得る弱点でもあった。","page":"136-137"},{"id":"h090","topic":"un","mode":"extreme","q":"IMF・IBRD・GATTをそれぞれ『為替の安定・復興融資・貿易自由化』に対応させた正しい順序は？","opts":["IBRD・IMF・GATT","IMF・IBRD・GATT","GATT・IBRD・IMF","IMF・GATT・IBRD"],"answer":1,"why":"国際通貨基金は通貨・為替、国際復興開発銀行は融資、GATTは関税などの貿易障壁の低減。それぞれ別の経済問題に対応する。","page":"138"},{"id":"h091","topic":"un","mode":"extreme","q":"国連安全保障理事会が重要な問題で決議を成立させられない場合、常任理事国に関して考えられる直接の制度上の原因は？","opts":["常任理事国が拒否権を行使した","総会の全加盟国が常に欠席した","IMFが反対した","IBRDの融資が停止した"],"answer":0,"why":"安保理の実質事項の決議には常任理事国の拒否権が関係する。国際金融機関は安保理の議決権を持たない。冷戦期の米ソ対立を考える材料にもなる。","page":"137"},{"id":"h092","topic":"un","mode":"extreme","q":"第二次大戦後に国連とブレトンウッズ体制が同時期に形成された理由として妥当なのは？","opts":["戦争の被害がなかったため既存制度の維持だけで十分だった","国際連合が各国通貨の発行権を独占したため","すべての国が同じ政治体制になったため","安全保障と国際経済の双方で戦前の失敗を繰り返さない体制が必要と考えられた"],"answer":3,"why":"国連は安全保障、IMF・IBRDを中心とする制度は通貨・経済の安定を目的とする。戦争と恐慌の反省が複数の国際制度を生んだ。","page":"136-139"},{"id":"h093","topic":"occupation","mode":"extreme","q":"日本の戦後改革のうち『権力・経済力の集中を弱める』方向性を最もよく表す組み合わせは？","opts":["国家総動員法と大政翼賛会","警察予備隊とNATO","財閥解体と農地改革","IMFとIBRD"],"answer":2,"why":"財閥解体は巨大企業集団への経済力集中、農地改革は地主による農地支配を是正。対象は異なるが戦後の経済民主化に共通する。","page":"142,254"},{"id":"h094","topic":"occupation","mode":"extreme","q":"大日本帝国憲法と日本国憲法の天皇の地位を比較した説明として正しいのは？","opts":["戦前は象徴、戦後は主権者となった","統治権を総攬する立場から、国民主権のもとで日本国と国民統合の象徴となった","どちらも一切の憲法上の地位を持たなかった","1947年に国連事務総長となった"],"answer":1,"why":"戦前は天皇主権のもとに統治権を総攬し、現行憲法では国民主権のもとで象徴と定められた。制度転換の中心的な比較点。","page":"142-143,255"},{"id":"h095","topic":"occupation","mode":"extreme","q":"『1946年に女性が国政選挙へ参加し、農地改革で自作農が増加した』という2事実に共通する背景は？","opts":["占領期の民主化改革","戦時中の国家総動員法の強化","固定為替相場制の廃止","サンフランシスコ平和条約の発効"],"answer":0,"why":"政治参加の拡大と経済・社会の民主化はいずれも占領初期の改革。女性参政権と農地改革では改革対象が異なる。","page":"142,254-255"},{"id":"h096","topic":"occupation","mode":"extreme","q":"日本国憲法の『国民主権・平和主義』と最も直接的に対応する制度上の変化は？","opts":["天皇の統治権と軍隊の独立を強めた","政治参加を男性軍人だけに限定した","新たな植民地の獲得を国策とした","主権を国民に置き、戦争の放棄を定めた"],"answer":3,"why":"国民主権は政治権力の根拠を国民とすること、平和主義は憲法第9条の戦争放棄などに表れる。理念と具体的な制度を対応させる。","page":"143,255"},{"id":"h097","topic":"cold","mode":"extreme","q":"1947〜1949年の欧州における米ソ対立を、政策と軍事的対立の双方から説明する正しい組み合わせは？","opts":["大政翼賛会・国家総動員法・農地改革","サンフランシスコ平和条約・安保改定・東京五輪","マーシャル＝プラン・ベルリン封鎖・NATO結成","警察予備隊・55年体制・日ソ共同宣言"],"answer":2,"why":"マーシャル＝プラン（1947）は西欧復興支援、ベルリン封鎖（1948）は東西対立、NATO（1949）は西側軍事同盟。冷戦の展開を政策と軍事の両面から把握する。","page":"146"},{"id":"h098","topic":"cold","mode":"extreme","q":"1949年の東アジア情勢を最も正確に説明したものは？","opts":["朝鮮戦争が休戦し、南北が統一された","中国大陸に中華人民共和国が成立し、国民党政権は台湾へ移った","日本が主権を回復し、GHQが終わった","中国大陸で国民党と共産党が共同政権を永続的に維持した"],"answer":1,"why":"国共内戦を経て毛沢東が中華人民共和国を宣言し、蒋介石らの国民党政権は台湾に移った。朝鮮戦争は翌1950年に始まる。","page":"147"},{"id":"h099","topic":"cold","mode":"extreme","q":"朝鮮戦争が日本の占領政策・経済の双方に影響した説明として正しいものは？","opts":["警察予備隊創設と特需景気の発生につながった","財閥解体が始まる唯一の直接的契機となった","日本国憲法が制定された唯一の理由となった","国際連合が解散する結果となった"],"answer":0,"why":"在日米軍の出動を背景に1950年警察予備隊が創設され、米軍調達に伴う特需が日本の景気を刺激した。安全保障と経済が連動した例。","page":"149,259"},{"id":"h100","topic":"cold","mode":"extreme","q":"『南北の国家成立→戦争勃発→休戦』という朝鮮半島の順序を示す正しい年の組は？","opts":["1945年→1949年→1951年","1950年→1948年→1953年","1949年→1953年→1960年","1948年→1950年→1953年"],"answer":3,"why":"大韓民国と朝鮮民主主義人民共和国は1948年成立。朝鮮戦争は1950年開戦、1953年休戦。独立と戦争を混同しない。","page":"147,257"},{"id":"h101","topic":"cold","mode":"extreme","q":"冷戦によりドイツが1949年に東西分裂したことと、1948年のベルリン封鎖の関係として最も適切なのは？","opts":["ベルリン封鎖によってソ連は西欧全域を併合した","東西ドイツはともにNATOを1948年に結成した","占領地域をめぐる東西の対立が深まり、ドイツの分断が固定化した","1949年にドイツ分割が完全に解消された"],"answer":2,"why":"ベルリン封鎖は西側占領地域への陸路を遮断した事件。占領地域・通貨政策などをめぐる東西の対立が分裂国家成立につながった。","page":"146"},{"id":"h102","topic":"independence","mode":"extreme","q":"占領政策の『逆コース』を理解する上で最も重要な国際的背景は？","opts":["第一次世界大戦の直後の国際連盟解散","アメリカとソ連の冷戦対立の深まり","1940年の東京五輪開催","日本が新たな植民地を獲得したこと"],"answer":1,"why":"アメリカは日本を反共の拠点として重要視し、経済復興・再軍備につながる政策へと占領の重点を変えた。世界史と日本史がつながる典型。","page":"148-149,259"},{"id":"h103","topic":"independence","mode":"extreme","q":"日本の『独立回復』と『米軍駐留継続』が矛盾せず同時に成立した制度上の理由は？","opts":["平和条約で占領が終了し、別に日米安保条約で駐留が認められたから","平和条約が日本のすべての主権をアメリカへ譲ったから","日本国憲法がGHQの無期限占領を定めたから","旧安保条約によって国連が解散したから"],"answer":0,"why":"平和条約は1952年に発効し日本は主権を回復した。一方1951年調印の旧安保条約によって米軍の駐留が継続した。別の法的枠組みを区別する。","page":"150-151,258"},{"id":"h104","topic":"independence","mode":"extreme","q":"1951年講和を『冷戦下の講和』と評価する根拠として最も適切なのは？","opts":["すべての国が無条件で参加・調印した","講和と同時に国連が廃止された","日本の軍政がGHQに代わって直接統治した","ソ連が調印せず、中国の代表政府も会議に招かれなかった"],"answer":3,"why":"ソ連は会議に出席したが条約には調印せず、中国を代表する政府も招かれなかった。冷戦による国際社会の分断を反映した講和だった。","page":"150-151"},{"id":"h105","topic":"independence","mode":"extreme","q":"日本の1945〜1960年の政治変化の順序として正しいものは？","opts":["日本国憲法施行→占領開始→55年体制→主権回復→安保改定","主権回復→占領開始→安保改定→55年体制→憲法施行","占領開始→日本国憲法施行→主権回復→55年体制→安保改定","55年体制→占領開始→憲法施行→安保改定→主権回復"],"answer":2,"why":"占領は1945、憲法施行1947、独立回復1952、55年体制1955、安保改定1960。原因・結果の順序も押さえる。","page":"140-151,252-259"},{"id":"h106","topic":"independence","mode":"extreme","q":"1955年体制が成立したときの政治勢力の組み合わせとして正しいものは？","opts":["軍部と大政翼賛会","保守合同の自由民主党と、左右が統一した日本社会党","GHQと日本共産党だけ","NATOとコメコン"],"answer":1,"why":"1955年に保守合同によって自民党、社会党の左右両派統一によって統一社会党が成立。長期的な与野党対立の軸が形成された。","page":"259"},{"id":"h107","topic":"independence","mode":"extreme","q":"『1951年の旧安保』と『1960年の改定安保』の違いとして正しいものは？","opts":["改定後にはアメリカの日本防衛義務が明記された","改定後にアメリカ軍が日本から無条件で全面撤退した","改定によって日本は主権を初めて回復した","1960年の改定で初めて平和条約が調印された"],"answer":0,"why":"1960年の新安保条約は日本への武力攻撃に対する共同対処を規定するなど、旧条約から内容が変化した。主権回復は1952年。","page":"259"},{"id":"h108","topic":"source","mode":"extreme","q":"資料A『自作農比率が1940年より1950年に大きく上昇』、資料B『地主の土地所有が制限された』。両資料をつなぐ改革は？","opts":["財閥解体","安保改定","国家総動員法","農地改革"],"answer":3,"why":"農地改革では地主の農地が小作農に売り渡され、自作農が増えた。資料Aは結果、Bは政策の方法を示す。統計と制度を組み合わせて判断する。","page":"254"},{"id":"h109","topic":"source","mode":"extreme","q":"資料A『戦後の輸出・生産が1950年頃から回復』、資料B『朝鮮戦争に伴い米軍が日本へ物資を発注』。説明は？","opts":["農地改革だけが軍需発注を生んだ","国連発足で日本への発注が禁止された","米軍調達による特需が日本経済の復興を後押しした","戦時統制が強化されてすべての工場が閉鎖された"],"answer":2,"why":"朝鮮戦争を背景に米軍からの大量調達が生まれ、生産・雇用が刺激された。生産統計と国際情勢を組み合わせると特需景気が説明できる。","page":"149,259"},{"id":"h110","topic":"source","mode":"extreme","q":"資料A『1945年に国連発足』、資料B『1947年から米ソの対立深まる』。二つの資料を両立させた解釈は？","opts":["国連発足で世界の対立は完全になくなった","国際協調の枠組みができても大国間の政治的対立は続いた","冷戦を開始する目的だけで国連が作られた","1947年に国連は正式に解散した"],"answer":1,"why":"国連の設立目的は平和維持だが、安保理常任理事国の拒否権などの制度により対立の影響を受ける。国際協調と冷戦は並存した。","page":"136-137,146"},{"id":"h111","topic":"source","mode":"extreme","q":"資料A『1946年に女性が国政選挙に参加』、資料B『日本国憲法は国民主権を掲げる』。共通する方向性は？","opts":["政治参加の拡大と民主化","天皇主権の強化","植民地獲得政策の再開","戦時経済統制の復活"],"answer":0,"why":"女性参政権の実現は政治参加の範囲を広げ、国民主権は政治の正当性を国民に置く。戦後民主化という共通の方向性。","page":"142-143,254-255"},{"id":"h112","topic":"source","mode":"extreme","q":"資料A『1944年に国際金融制度の会議』、資料B『1945年に国際平和機構が発足』。それぞれの中心課題の組み合わせは？","opts":["土地所有の改革と、女性参政権の廃止","東西ドイツ統一と、国共内戦の終結","大政翼賛会の設立と、朝鮮戦争の休戦","通貨・国際経済の安定と、平和・安全保障の維持"],"answer":3,"why":"ブレトンウッズ会議は戦後の国際金融の安定、国際連合は平和と安全を目標とした。複数制度を役割ごとに整理する問題。","page":"136-139"},{"id":"h113","topic":"source","mode":"extreme","q":"『1952年に主権回復』という資料だけから、『沖縄を含む全地域への施政権が同年日本に戻った』と判断できるか？","opts":["判断できる。日本のすべての領土は同時に施政権が戻った","判断できる。1945年にはすでに完全回復していた","判断できない。沖縄などは米国の施政権下に残った","判断できない。日本は1952年に主権を回復していない"],"answer":2,"why":"1952年の平和条約発効で日本は主権を回復したが、沖縄などは米国施政権下のまま。政治的な独立と個別地域の施政権を区別する。","page":"150-151"},{"id":"h114","topic":"olympic","mode":"extreme","q":"1940年大会の中止と1964年東京大会の開催を比較する歴史的な説明として最も適切なのは？","opts":["1940年大会は成功し、1964年大会が戦争で中止された","戦争によって失われた国際スポーツの機会が、戦後復興と国際復帰を経て再び実現した","両大会とも日本が初めて参加したオリンピックだった","どちらも同じ1940年に開催された"],"answer":1,"why":"1940年に予定された東京大会は開催されず、1964年の東京大会は復興・国際社会への復帰を象徴した。スポーツを当時の国際情勢と結びつける。","page":"242-243"}];

function chem(){const counted=(m,k)=>QUESTIONS.filter(q=>q.mode===m&&(k==='both'||q.kind===k)).length;shell(`${back('home')}<div class="hero"><div class="eyebrow">CHEMISTRY</div><h1>⚗️ 化学</h1><p>計算は自由入力、知識は4択。すべての問題に途中式・解説・出典ページを付けています。</p></div>${store.active?`<div class="space"></div>${button('▶ 途中の演習を再開','resumeSession()','primary full')}`:''}<div class="sectionhead"><h2>問題の種類を選ぶ</h2></div><div class="grid"><button class="tile subject" onclick="chooseKind('knowledge')"><div class="emoji">📘</div><div><h2>知識問題</h2><p>通常 ${counted('normal','knowledge')}問 ／ 変態 ${counted('extreme','knowledge')}問</p></div></button><button class="tile subject" onclick="chooseKind('calculation')"><div class="emoji">🧮</div><div><h2>計算問題</h2><p>通常 ${counted('normal','calculation')}問 ／ 変態 ${counted('extreme','calculation')}問</p></div></button><button class="tile subject" onclick="chooseKind('both')"><div class="emoji">🔀</div><div><h2>総合演習</h2><p>知識と計算の混合問題</p></div></button></div><div class="sectionhead"><h2>その他</h2></div><div class="grid2">${button('★ ブックマーク・間違えた問題','navigate(\'review\')','full')}${button('📊 成績・履歴','navigate(\'stats\')','full')}</div><div class="space"></div><div class="notice">除外：ワーク55ページ全体、56ページ問題81（溶解度）、62ページ問題92、65ページ問題100。教科書101ページの溶解度・再結晶も出題しません。基礎法則の問題93・101は指定除外ではないため扱います。</div>`)}
function chooseKind(k){kind=k;mode='normal';navigate('setup')}
function optionChips(options,current,handler){return `<div class="chipgroup">${options.map(x=>`<button class="chip ${current===x[0]?'active':''}" onclick="${handler}('${x[0]}')">${x[1]}</button>`).join('')}</div>`}
function setMode(m){mode=m;setup()};function setN(n){number=n;setup()};function setOrder(n){order=n;setup()};function topicToggle(t){selectedTopics=selectedTopics.includes(t)?selectedTopics.filter(x=>x!==t):[...selectedTopics,t];setup()}
function eligible(){return QUESTIONS.filter(q=>q.mode===mode&&(kind==='both'||q.kind===kind)&&selectedTopics.includes(q.topic))}
function setup(){let n=eligible().length;shell(`${back('chem')}<div class="eyebrow">CHEMISTRY / SETUP</div><h1>演習の設定</h1><div class="card"><div class="sectionhead" style="margin-top:0"><h2>難易度</h2></div>${optionChips([['normal','通常｜考査対策'],['extreme','🔥 変態｜超高難度']],mode,'setMode')}<p class="helper">${mode==='normal'?'教科書・ワークに沿った基本〜応用問題。':'範囲内の既習知識を組み合わせる発展問題。出題可能性より思考力を優先。'}</p><hr class="divider"><div class="sectionhead" style="margin-top:0"><h2>出題単元</h2><span class="tag">複数選択</span></div><div class="grid2">${TOPICS.map(t=>`<label class="checkitem"><input type="checkbox" ${selectedTopics.includes(t[0])?'checked':''} onchange="topicToggle('${t[0]}')">${t[1]}<small class="muted">${t[2]}</small></label>`).join('')}</div><hr class="divider"><div class="sectionhead" style="margin-top:0"><h2>問題数</h2><span class="tag">対象 ${n}問</span></div>${optionChips([[10,'10問'],[20,'20問'],[50,'50問'],['all','全問']],number,'setN')}<hr class="divider"><div class="sectionhead" style="margin-top:0"><h2>出題順</h2></div>${optionChips([['random','ランダム'],['ordered','教科書順']],order,'setOrder')}<div class="space"></div>${button(`この設定で開始（${number==='all'?n:Math.min(n,number)}問）`,'startSession()','primary full')}<div class="space"></div><p class="helper">各回答・進行状況はブラウザ内に保存され、途中から再開できます。演習終了時には単元別に分析できます。</p></div>`)}
function shuffle(xs){let a=xs.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function resumeSession(){if(!store.active){navigate('chem');return}session=store.active;let item=session.results.find(r=>r.id===session.ids[session.index]);answer=item?item.answer:null;revealed=!!item;view='quiz';quiz()}
function startSession(replayIds){let pool=replayIds?QUESTIONS.filter(q=>replayIds.includes(q.id)):eligible();if(!pool.length){alert('この設定に該当する問題がありません。');return}if(order==='random')pool=shuffle(pool);let take=replayIds?pool.length:(number==='all'?pool.length:Math.min(Number(number),pool.length));let ids=pool.slice(0,take).map(q=>q.id);session={ids,index:0,results:[],started:Date.now(),source:kind,mode};answer=null;revealed=false;showSource=true;store.active=session;persist();view='quiz';quiz()}
function current(){return QUESTIONS.find(q=>q.id===session.ids[session.index])}
function topicName(q){return TOPICS.find(t=>t[0]===q.topic)?.[1]||q.topic}
function qchoices(q){let arr=q.opts.map((text,i)=>({text,i}));let base=q.id.split('').reduce((s,c)=>s+c.charCodeAt(0),0)+session.index*117;for(let i=arr.length-1;i>0;i--){let j=(base*17+i*11)%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function inputChoice(idx){if(revealed)return;answer=idx;submit()}
function inputNumber(v){if(revealed)return;answer=v;let b=document.getElementById('markButton');if(b)b.disabled=!(String(v).trim())}
function numeric(s){let t=String(s).trim().replaceAll('，',',').replaceAll('．','.').replaceAll('−','-').replaceAll('×10^','e').replaceAll('×10','e').replaceAll(' ','').replaceAll(',','');if(!t)return NaN;return Number(t)}
function grade(q,a){if(q.kind==='knowledge')return a===q.answer;let v=numeric(a);return Number.isFinite(v)&&Math.abs(v-q.answer)<=Math.max(Math.abs(q.answer)*(q.tol||.012),1e-10)}
function fmt(n){if(typeof n!=='number')return String(n);if(n===0)return'0';if(Math.abs(n)>=1e6||Math.abs(n)<.0001)return n.toExponential(3).replace('e+','×10^').replace('e-','×10^-');return Number(n.toPrecision(7)).toString()}
function submit(){let q=current();if(answer===null||String(answer).trim()==='')return;let ok=grade(q,answer);session.results.push({id:q.id,ok,answer});revealed=true;store.active=session;if(!ok&&!store.wrong.includes(q.id))store.wrong.push(q.id);if(ok)store.wrong=store.wrong.filter(x=>x!==q.id);persist();quiz(false)}
function skip(){if(!revealed){let q=current();session.results.push({id:q.id,ok:false,answer:'（未回答）'});if(!store.wrong.includes(q.id))store.wrong.push(q.id);store.active=session;persist()}advance()}
function advance(){if(session.index>=session.ids.length-1){finish();return}session.index++;answer=null;revealed=false;store.active=session;persist();quiz()}
function finish(){let h={time:Date.now(),duration:Math.round((Date.now()-session.started)/1000),total:session.results.length,correct:session.results.filter(r=>r.ok).length,mode:session.mode,kind:session.source,results:session.results};store.history.unshift(h);store.active=null;store.history=store.history.slice(0,60);persist();view='result';render()}
function toggleBookmark(id){store.bookmarks=store.bookmarks.includes(id)?store.bookmarks.filter(x=>x!==id):[...store.bookmarks,id];persist();document.querySelectorAll('[data-bookmark]').forEach(el=>{el.innerText=store.bookmarks.includes(id)?'★ 保存済み':'☆ ブックマーク'})}
function quiz(scroll=true){let q=current(),choices=q.kind==='knowledge'?qchoices(q):[],progress=(session.index)/session.ids.length,checked=session.results.find(x=>x.id===q.id),ok=checked?.ok;const select= q.kind==='knowledge'?`<div>${choices.map((x,j)=>`<button class="choice ${answer===x.i?'selected':''} ${revealed&&x.i===q.answer?'correct':''} ${revealed&&answer===x.i&&!ok?'wrong':''}" onclick="inputChoice(${x.i})" ${revealed?'disabled':''}><span class="letter">${'ABCD'[j]}</span>${h(x.text)}</button>`).join('')}</div>`:`<label class="sr" for="calcAnswer">解答</label><div class="numrow"><input id="calcAnswer" inputmode="decimal" autocomplete="off" placeholder="数値を入力（例 0.25 / 6e23）" value="${h(answer??'')}" oninput="inputNumber(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();submit()}" ${revealed?'disabled':''}><span>${h(q.unit||'数値')}</span></div><p class="helper">指数表記は 6e23 のように入力できます。単位は右側に表示しています。</p>`;
const expl=revealed?`<div role="status" aria-live="polite" class="explain ${ok?'':'wrong'}"><h3>${ok?'✓ 正解！':'✕ 不正解'}　<span style="font-size:14px">正答：${q.kind==='knowledge'?h(q.opts[q.answer]):h(fmt(q.answer)+' '+q.unit)}</span></h3><p><b>考え方・途中式</b></p><p>${h(q.why)}</p><div class="source"><strong>📖 教科書：${h(q.page)}ページ</strong>　／　ワーク：${h(q.work)}ページ・問題<br>該当する定義・公式・例題を確認できます。教科書の節番号：${topicName(q)}。</div></div>`:'';
let favorite=store.bookmarks.includes(q.id);let html=`${back('chem')}<div class="row mobilewrap"><div><div class="eyebrow">CHEMISTRY / ${session.mode==='extreme'?'EXTREME':'NORMAL'}</div><h2 style="margin:3px 0">${session.index+1} / ${session.ids.length} 問</h2></div><div><span class="tag">${q.kind==='knowledge'?'知識':'計算'}</span> <span class="tag ${session.mode==='extreme'?'gold':''}">${session.mode==='extreme'?'🔥 変態':'通常'}</span></div></div><div class="bar"><div style="width:${progress*100}%"></div></div><div class="space"></div><div class="card"><div class="row mobilewrap"><span class="tag">${topicName(q)}</span><button class="toggle bookmark" data-bookmark onclick="toggleBookmark('${q.id}')">${favorite?'★ 保存済み':'☆ ブックマーク'}</button></div><div class="question">${h(q.q)}</div>${select}${expl}<div class="space"></div>${revealed?button(session.index===session.ids.length-1?'結果を見る':'次の問題へ →','advance()','primary full'):q.kind==='knowledge'?button('スキップ','skip()','full'):`<div class="grid2">${q.kind==='knowledge'?'':button('答え合わせ','submit()','primary full')}${button('スキップ','skip()','full')}</div>`}</div><div class="space"></div><div class="row"><span class="helper">${q.kind==='knowledge'?'選択肢をタップすると即採点・解説表示':'回答後に解説を表示します'}</span><button class="toggle" onclick="if(confirm('途中で演習を終了し結果を確認しますか？'))finish()">演習を終了</button></div>`;A.innerHTML=`<header class="top"><div class="brand">✦ 考査週間⑤問題集</div><span class="tag">化学</span></header>${html}`;if(scroll)window.scrollTo(0,0);let b=document.getElementById('markButton');if(b)b.disabled=answer===null}
function result(){const hist=store.history[0];if(!hist){navigate('chem');return}let by={};for(let item of hist.results){let q=QUESTIONS.find(x=>x.id===item.id);if(!q)continue;if(!by[q.topic])by[q.topic]={n:0,c:0};by[q.topic].n++;if(item.ok)by[q.topic].c++}let wrongIds=hist.results.filter(r=>!r.ok).map(r=>r.id);shell(`${back('chem')}<div class="eyebrow">RESULT / CHEMISTRY</div><h1>演習結果</h1><div class="grid"><div class="stat"><div class="big">${Math.round(100*hist.correct/Math.max(hist.total,1))}%</div><small>正答率</small></div><div class="stat"><div class="big">${hist.correct}/${hist.total}</div><small>正解数</small></div><div class="stat"><div class="big">${Math.floor(hist.duration/60)}分${hist.duration%60}秒</div><small>所要時間</small></div></div><div class="sectionhead"><h2>単元別の正答率</h2></div><div class="card">${Object.entries(by).map(([t,s])=>`<div style="margin-bottom:13px"><div class="row"><b>${TOPICS.find(x=>x[0]===t)?.[1]}</b><span class="muted">${s.c}/${s.n}</span></div><div class="bar"><div style="width:${100*s.c/s.n}%"></div></div></div>`).join('')}</div><div class="sectionhead"><h2>復習</h2></div><div class="grid2">${button(`不正解を解き直す（${wrongIds.length}問）`,'retryWrong()','primary full')}${button('回答の一覧を見る','navigate(\'review\')','full')}</div><div class="space"></div>${button('化学メニューへ戻る','navigate(\'chem\')','full')}`)}
function retryWrong(){let latest=store.history[0];let ids=latest?.results.filter(r=>!r.ok).map(r=>r.id)||[];if(!ids.length){alert('今回の不正解はありません。');return}startSession(ids)}
function review(){let tab=window.reviewTab||'wrong';let ids=tab==='wrong'?store.wrong:store.bookmarks;let found=QUESTIONS.filter(q=>ids.includes(q.id));shell(`${back('chem')}<div class="eyebrow">REVIEW / CHEMISTRY</div><h1>復習リスト</h1>${optionChips([['wrong','間違えた問題'],['bookmark','★ ブックマーク']],tab,'setReviewTab')}<div class="space"></div><div class="row"><span class="muted">${found.length}問</span>${button('このリストをまとめて演習','reviewStart()','primary')}</div><div class="space"></div>${found.length?found.map(q=>`<div class="listcard"><div class="row"><span class="tag">${topicName(q)}</span><span class="tag">${q.mode==='extreme'?'変態':'通常'}</span></div><p style="font-weight:800;margin:10px 0">${h(q.q)}</p><details><summary class="toggle" style="cursor:pointer">答え・解説を見る</summary><p><b>答え：</b>${q.kind==='knowledge'?h(q.opts[q.answer]):h(fmt(q.answer)+' '+q.unit)}</p><p>${h(q.why)}</p><p class="helper">教科書 p.${h(q.page)} ／ ワーク p.${h(q.work)}</p></details></div>`).join(''):'<div class="card">まだ該当する問題はありません。</div>'}`)}

function stats(){let hs=store.history;let total=hs.reduce((s,x)=>s+x.total,0),correct=hs.reduce((s,x)=>s+x.correct,0);shell(`${back('home')}<div class="eyebrow">LEARNING RECORDS</div><h1>学習履歴</h1><div class="grid"><div class="stat"><div class="big">${hs.length}</div><small>演習回数</small></div><div class="stat"><div class="big">${total}</div><small>総解答数</small></div><div class="stat"><div class="big">${total?Math.round(100*correct/total):0}%</div><small>累計正答率</small></div></div><div class="sectionhead"><h2>最近の演習</h2></div>${hs.length?hs.slice(0,20).map(x=>`<div class="listcard"><div class="row"><b>${x.kind==='both'?'総合':x.kind==='knowledge'?'知識':'計算'}／${x.mode==='extreme'?'変態':'通常'}</b><span>${x.correct}/${x.total}</span></div><div class="helper">${new Date(x.time).toLocaleString('ja-JP')} ｜ ${Math.floor(x.duration/60)}分${x.duration%60}秒</div></div>`).join(''):'<div class="card">まだ記録がありません。化学から演習を始めましょう。</div>'}<div class="space"></div><div class="notice">成績はこのブラウザ内に保存します。ブラウザのデータを消すと履歴も消えます。</div><div class="space"></div>${button('履歴をリセット','clearHistory()','danger full')}`)}

function histSetup(){let n=histPool().length;shell(`${back('histHome')}<div class="eyebrow">HISTORY / SETUP</div><h1>歴史総合｜演習設定</h1><div class="card"><div class="sectionhead" style="margin-top:0"><h2>演習形式</h2></div>${optionChips([['all','総合'],['knowledge','知識'],['chronology','年代'],['source','資料'],['reason','因果']],histKind,'histGoKind')}<hr class="divider"><h2>難易度</h2>${optionChips([['normal','通常｜定期考査'],['extreme','🔥 変態｜発展']],histMode,'histSetMode')}<p class="helper">${histMode==='normal'?'教科書の基本事項から標準的な資料・時系列問題。':'複数単元を結びつけ、背景や根拠を考える高難度の独立問題。'}</p><hr class="divider"><div class="sectionhead"><h2>出題範囲</h2><span class="tag">複数選択可能</span></div><div class="grid2">${HISTORY_TOPICS.map(t=>`<label class="checkitem"><input type="checkbox" ${histTopics.includes(t[0])?'checked':''} onchange="histToggleTopic('${t[0]}')"><span>${h(t[1])}<small class="muted" style="display:block">教科書 p.${h(t[2])}</small></span></label>`).join('')}</div><hr class="divider"><div class="sectionhead"><h2>問題数</h2><span class="tag">対象 ${n}問</span></div>${optionChips([[10,'10問'],[20,'20問'],[50,'50問'],['all','全問']],histN,'histSetN')}<hr class="divider"><h2>出題順</h2>${optionChips([['random','ランダム'],['ordered','範囲順']],histOrder,'histSetOrder')}<div class="space"></div>${button(`演習開始（${histN==='all'?n:Math.min(Number(histN),n)}問）`,'histStart()','primary full')}<div class="space"></div><p class="helper">選択した難易度・形式に対象問題が存在しないときは、分野を増やすか設定を変更してください。</p></div>`) }
function histStart(ids){let pool=ids?HISTORYQ.filter(q=>ids.includes(q.id)):histPool();if(!pool.length){alert('選択した設定に対応する問題がありません。難易度や出題形式を変えてください。');return}if(histOrder==='random')pool=shuffle(pool);let take=ids?pool.length:histN==='all'?pool.length:Math.min(Number(histN),pool.length);histSession={ids:pool.slice(0,take).map(x=>x.id),index:0,results:[],started:Date.now(),mode:histMode,kind:histKind};histAnswer=null;histReveal=false;histStore.active=histSession;histSave();histView('histQuiz')}
function histResume(){if(!histStore.active){histView('histHome');return}histSession=histStore.active;let done=histSession.results.find(r=>r.id===histSession.ids[histSession.index]);histAnswer=done?done.answer:null;histReveal=!!done;histView('histQuiz')}
function histCurrent(){return HISTORYQ.find(x=>x.id===histSession.ids[histSession.index])}
function histSelect(i){if(histReveal)return;histAnswer=i;let q=histCurrent(),ok=i===q.answer;histSession.results.push({id:q.id,answer:i,ok});histReveal=true;histStore.active=histSession;if(ok)histStore.wrong=histStore.wrong.filter(x=>x!==q.id);else if(!histStore.wrong.includes(q.id))histStore.wrong.push(q.id);histSave();histQuiz(false)}
function histSkip(){if(!histReveal){let q=histCurrent();histSession.results.push({id:q.id,answer:'（未回答）',ok:false});if(!histStore.wrong.includes(q.id))histStore.wrong.push(q.id);histSave()}histAdvance()}
function histAdvance(){if(histSession.index>=histSession.ids.length-1){histFinish();return}histSession.index++;histAnswer=null;histReveal=false;histStore.active=histSession;histSave();histQuiz()}
function histFinish(){let z={time:Date.now(),duration:Math.round((Date.now()-histSession.started)/1000),correct:histSession.results.filter(x=>x.ok).length,total:histSession.results.length,mode:histSession.mode,kind:histSession.kind,results:histSession.results};histStore.history.unshift(z);histStore.history=histStore.history.slice(0,60);histStore.active=null;histSave();histView('histResult')}
function histMark(){let q=histCurrent();histStore.bookmarks=histStore.bookmarks.includes(q.id)?histStore.bookmarks.filter(x=>x!==q.id):[...histStore.bookmarks,q.id];histSave();document.querySelectorAll('[data-histbookmark]').forEach(x=>x.textContent=histStore.bookmarks.includes(q.id)?'★ 保存済み':'☆ ブックマーク')}
function histQuiz(scroll=true){if(!histSession){histView('histHome');return}let q=histCurrent();if(!q){histView('histHome');return}let result=histSession.results.find(x=>x.id===q.id),ok=result?.ok,shown=q.opts.map((value,i)=>({value,i}));let seed=q.id.split('').reduce((s,c)=>s+c.charCodeAt(0),0)+histSession.index*37;for(let i=3;i>0;i--){let j=(seed*11+i*7)%(i+1);[shown[i],shown[j]]=[shown[j],shown[i]]}let boxChoices=shown.map((x,j)=>`<button class="choice ${histReveal&&x.i===q.answer?'correct':''} ${histReveal&&x.i===histAnswer&&!ok?'wrong':''}" onclick="histSelect(${x.i})" ${histReveal?'disabled':''}><span class="letter">${'ABCD'[j]}</span><span>${h(x.value)}</span></button>`).join('');let why=histReveal?`<div role="status" aria-live="polite" class="explain ${ok?'':'wrong'}"><h3>${ok?'✓ 正解！':'✕ 不正解'}　<span style="font-size:14px">正答：${h(q.opts[q.answer])}</span></h3><p><b>詳しい解説</b></p><p>${h(q.why)}</p><p><b>復習ポイント</b>：誤答の選択肢も、成立した年代・組織の役割・因果関係を区別して確認しましょう。</p><div class="source"><strong>📖 教科書 p.${h(q.page)}</strong><br>関連項目：${h(histTopic(q))}。該当ページの本文・図表を見直してください。</div></div>`:'';let saved=histStore.bookmarks.includes(q.id);A.innerHTML=`<header class="top"><div class="brand">✦ 考査週間⑤問題集</div><span class="tag">歴史総合</span></header>${back('histHome')}<div class="row mobilewrap"><div><div class="eyebrow" style="color:#e8af88">HISTORY / ${histSession.mode==='extreme'?'EXTREME':'NORMAL'}</div><h2 style="margin:3px 0">${histSession.index+1} / ${histSession.ids.length} 問</h2></div><div><span class="tag">${h(histTopic(q))}</span> <span class="tag ${q.mode==='extreme'?'gold':''}">${q.mode==='extreme'?'🔥 変態':'通常'}</span></div></div><div class="bar"><div style="width:${100*histSession.index/histSession.ids.length}%"></div></div><div class="space"></div><div class="card"><div class="row mobilewrap"><span class="tag">${h(histKindName(histType(q)))}</span><button class="toggle bookmark" data-histbookmark onclick="histMark()">${saved?'★ 保存済み':'☆ ブックマーク'}</button></div><div class="question">${h(q.q)}</div>${boxChoices}${why}<div class="space"></div>${histReveal?button(histSession.index===histSession.ids.length-1?'結果を見る':'次の問題へ →','histAdvance()','primary full'):button('スキップ','histSkip()','full')}</div><div class="space"></div><div class="row"><span class="helper">選択肢をタップするとその場で採点します</span><button class="toggle" onclick="if(confirm('途中で演習を終了し結果を確認しますか？'))histFinish()">演習を終了</button></div>`;if(scroll)window.scrollTo(0,0)}
function histResult(){let z=histStore.history[0];if(!z){histView('histHome');return}let by={};for(let r of z.results){let q=HISTORYQ.find(x=>x.id===r.id);if(!q)continue;if(!by[q.topic])by[q.topic]={n:0,c:0};by[q.topic].n++;if(r.ok)by[q.topic].c++}let wrong=z.results.filter(x=>!x.ok).map(x=>x.id);shell(`${back('histHome')}<div class="eyebrow">HISTORY / RESULT</div><h1>歴史総合｜演習結果</h1><div class="grid"><div class="stat"><div class="big">${Math.round(100*z.correct/Math.max(z.total,1))}%</div><small>正答率</small></div><div class="stat"><div class="big">${z.correct}/${z.total}</div><small>正解数</small></div><div class="stat"><div class="big">${Math.floor(z.duration/60)}分${z.duration%60}秒</div><small>所要時間</small></div></div><div class="sectionhead"><h2>分野別の成績</h2></div><div class="card">${Object.entries(by).map(([t,s])=>`<div style="margin-bottom:13px"><div class="row"><b>${h(HISTORY_TOPICS.find(x=>x[0]===t)?.[1]||t)}</b><span class="muted">${s.c}/${s.n}</span></div><div class="bar"><div style="width:${100*s.c/s.n}%"></div></div></div>`).join('')}</div><div class="sectionhead"><h2>復習</h2></div><div class="grid2">${button(`今回の間違いを解き直す（${wrong.length}問）`,'histRetry()','primary full')}${button('復習リストを見る','histView(\'histReview\')','full')}</div><div class="space"></div>${button('歴史メニューへ戻る','histView(\'histHome\')','full')}`)}

function bioHome(){let n=BIOQ.length;let hs=bioStore.history;shell(`${back('home')}<div class="hero" style="background:linear-gradient(145deg,#17483e,#172e3c 85%);border-color:#427867"><div class="eyebrow" style="color:#a2edc6">BIOLOGY / SPECIALIZED WORKSPACE</div><h1>🧬 生物基礎</h1><p>教科書 p.50〜96。遺伝情報とDNA・複製・転写/翻訳・体内環境を独立した演習形式で学習。</p><div class="rowwrap" style="margin-top:12px"><span class="tag ok">収録 ${n}問</span><span class="tag">通常 ${BIOQ.filter(x=>x.mode==='normal').length}問</span><span class="tag gold">変態 ${BIOQ.filter(x=>x.mode==='extreme').length}問</span></div></div>${bioStore.active?`<div class="space"></div>${button('▶ 前回の生物演習を再開','bioResume()','primary full')}`:''}<div class="sectionhead"><h2>問題形式を選択</h2></div><div class="grid2"><button class="tile" onclick="bioChoose('knowledge')"><strong>📖 知識・用語</strong><small>用語の意味・実験・基本原理を四択で即時判定</small></button><button class="tile" onclick="bioChoose('calculation')"><strong>🧮 計算・データ</strong><small>塩基組成・細胞周期・翻訳・酸素解離曲線など</small></button><button class="tile" onclick="bioChoose('reason')"><strong>🔬 実験・論理考察</strong><small>結果から仮説を検証する発展問題</small></button><button class="tile" onclick="bioChoose('all')"><strong>🔀 総合演習</strong><small>通常・変態モードを選び、単元を横断して出題</small></button></div><div class="sectionhead"><h2>復習と記録</h2></div><div class="grid2">${button('★ 間違い・ブックマーク','bioGo(\'bioReview\')','full')}${button('📊 生物の成績・履歴','bioGo(\'bioStats\')','full')}</div><div class="space"></div><div class="notice">範囲は送付された生物教科書の写真を優先しています。ワーク後半にある神経系・ホルモンなどは、今回の教科書写真で範囲を確認できていないため未収録です。</div>`)}

function bioStart(ids){let pool=ids?BIOQ.filter(x=>ids.includes(x.id)):bioPool();if(!pool.length){alert('条件に合う問題がありません。');return}if(bioOrder==='random')pool=shuffle(pool);let n=ids?pool.length:(bioNum==='all'?pool.length:Math.min(Number(bioNum),pool.length));bioSession={ids:pool.slice(0,n).map(x=>x.id),index:0,results:[],started:Date.now(),mode:bioMode,kind:bioKind};bioAnswer=null;bioReveal=false;bioStore.active=bioSession;bioSave();bioGo('bioQuiz')}
